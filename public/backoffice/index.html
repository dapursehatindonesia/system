<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Backoffice · Healthy Go</title>
<link rel="icon" type="image/png" sizes="32x32" href="/shared/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/shared/favicon.png">
<link rel="apple-touch-icon" href="/shared/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

:root{--hg:#074b34;--hg-deep:#04331f;--hg-700:#0b5e41;--hg-500:#1d8a5b;--hg-100:#e3f1e8;--hg-50:#f1f7f3;--sun:#f3cf1b;
--bg:#f4f6f1;--card:#fff;--ink:#13241c;--muted:#5d6e65;--line:#dde6df;--field:#fff;
--ok:#167a43;--ok-bg:#e2f4e8;--warn:#9a5b00;--warn-bg:#fff2d3;--bad:#b4281c;--bad-bg:#fde7e4;--info:#1f5f99;--info-bg:#e6f0fb;
--radius:14px;--side:264px;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a15;--card:#16241d;--ink:#e6efe9;--muted:#9db0a5;--line:#2a3c33;--field:#1b2c24;
--hg-100:#1d3a2c;--hg-50:#18291f;--ok:#5fd08f;--ok-bg:#183a27;--warn:#f0b54a;--warn-bg:#3a2d12;--bad:#f2877b;--bad-bg:#3e1d19;--info:#8bbcf0;--info-bg:#18293d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a15;--card:#16241d;--ink:#e6efe9;--muted:#9db0a5;--line:#2a3c33;--field:#1b2c24;
--hg-100:#1d3a2c;--hg-50:#18291f;--ok:#5fd08f;--ok-bg:#183a27;--warn:#f0b54a;--warn-bg:#3a2d12;--bad:#f2877b;--bad-bg:#3e1d19;--info:#8bbcf0;--info-bg:#18293d;color-scheme:dark}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.btn-primary{background:var(--hg);border-color:var(--hg);color:#fff}
.btn-primary:hover{background:var(--hg-700)}
.btn-soft{background:var(--hg-50);border-color:var(--hg-100)}
.btn-danger{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
.btn-sm{padding:5px 10px;font-size:13px;border-radius:8px}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
label.f>input,label.f>select,label.f>textarea{color:var(--ink);font-weight:500;font-size:15px}

/* Prototype bar */
.proto{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:center;padding:7px 14px;background:var(--sun);color:#3b3000;font-size:13px;font-weight:600}
.proto select{padding:3px 8px;border-radius:8px;border:1px solid #c9a900;background:#fff8d6;color:#3b3000}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--sun)}

/* Layout */
.shell{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{background:var(--hg-deep);color:#e8f3ec;display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}
.brand-mark{width:38px;height:38px;border-radius:11px;background:var(--sun);color:var(--hg-deep);display:grid;place-items:center;font-weight:800;font-size:15px}
.brand b{display:block;font-size:15px}.brand small{color:#a9c9b6;font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:#d6e9dd;text-decoration:none;font-weight:600;font-size:14px}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a.active{background:var(--hg-700);color:#fff;box-shadow:inset 3px 0 0 var(--sun)}
.nav .grp{margin:14px 12px 4px;font-size:12px;color:#8fb59e;font-weight:600}
.side-foot{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:2px}
.side-foot a{color:#cfe4d7;text-decoration:none;font-size:13px;padding:7px 12px;border-radius:8px}
.side-foot a:hover{background:rgba(255,255,255,.07)}
.me{padding:10px 12px;font-size:13px;color:#a9c9b6}.me b{color:#fff;display:block;font-size:14px}
main{min-width:0;padding:22px clamp(14px,3vw,34px) 60px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.top h1{margin:0;font-size:24px;letter-spacing:-.01em}
.menu-btn{display:none}
.scrim{display:none}

/* Components */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.card+.card{margin-top:16px}
.card h2{margin:0 0 4px;font-size:17px}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.grow{flex:1 1 180px}
.tabs{display:inline-flex;gap:4px;padding:4px;background:var(--hg-50);border:1px solid var(--line);border-radius:12px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:9px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--hg-50);font-size:12.5px;color:var(--muted);font-weight:700;position:sticky;top:0;z-index:2}
.tbl-scroll{overflow:auto}
.th-sort{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:none;border:0;padding:0;border-radius:4px;font:inherit;font-weight:700;color:inherit;text-align:left}
th.num .th-sort span:first-child{margin-left:auto}
.th-sort:hover{color:var(--ink)}
.arr{font-size:9px;color:var(--hg-500);letter-spacing:-1px}.arr.idle{color:var(--line);font-size:8px}
.th-sort:hover .arr.idle{color:var(--muted)}
th[aria-sort="ascending"],th[aria-sort="descending"]{color:var(--ink)}
td.wrap{white-space:normal;min-width:260px;max-width:420px}
.freeze td:first-child,.freeze th:first-child{position:sticky;left:0;z-index:1;background:var(--card);box-shadow:1px 0 0 var(--line)}
.freeze th:first-child{z-index:3;background:var(--hg-50)}
tr.click:hover td{background:var(--hg-50)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover td{background:var(--hg-50)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.c-ok{background:var(--ok-bg);color:var(--ok)}.c-warn{background:var(--warn-bg);color:var(--warn)}.c-bad{background:var(--bad-bg);color:var(--bad)}.c-info{background:var(--info-bg);color:var(--info)}.c-mute{background:var(--hg-50);color:var(--muted);border:1px solid var(--line)}
.muted{color:var(--muted)}.small{font-size:12.5px}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* Dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:16px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.kpi span{display:block;font-size:13px;color:var(--muted);font-weight:600}
.kpi b{display:block;font-size:26px;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-size:12px}
.kpi.lead{background:var(--hg);border-color:var(--hg);color:#fff}.kpi.lead span,.kpi.lead small{color:#bfe0cc}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:110px 1fr 170px;gap:10px;align-items:center;font-size:13.5px}
.bar-track{height:12px;background:var(--hg-50);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.bar-fill{height:100%;background:var(--hg-500);border-radius:999px}
.bar-fill.w{background:var(--warn)}.bar-fill.b{background:var(--bad)}
.pct{display:inline-block;min-width:46px}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ms{position:relative}
.ms-btn{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;font-weight:500;background:var(--field);padding:7px 30px 7px 12px;position:relative}
.ms-btn::after{content:"▾";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.ms-btn[aria-expanded="true"]{border-color:var(--hg-500)}
.ms-lbl{font-size:12px;color:var(--muted);font-weight:600}
.ms-val{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ms-pop{position:absolute;z-index:25;top:calc(100% + 4px);left:0;min-width:100%;width:max-content;max-width:min(320px,86vw);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:8px}
.ms-list{max-height:270px;overflow:auto;display:flex;flex-direction:column}
.ms-list label{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:14px}
.ms-list label:hover{background:var(--hg-50)}
.ms-q{width:100%;margin-bottom:6px}
.ms-foot{border-top:1px solid var(--line);margin-top:6px;padding-top:6px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr));gap:16px}
.charts .card{margin:0}
.bar-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-fill.i{background:var(--info)}
.pie{display:flex;flex-wrap:wrap;gap:18px;align-items:center}
.pie-n{font-size:18px;font-weight:800;fill:var(--ink)}.pie-l{font-size:12px;fill:var(--muted)}
.pie-legend{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14px;flex:1 1 160px}
.pie-legend li{display:grid;grid-template-columns:12px 1fr auto auto;gap:8px;align-items:center}
.sw{width:12px;height:12px;border-radius:4px}
.absen{display:grid;grid-template-columns:minmax(0,420px) 1fr;gap:22px;align-items:start}
.cam-box{position:relative;aspect-ratio:4/3;background:#0b1712;border-radius:14px;overflow:hidden}
.cam-box video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam-msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:#dfeee5;font-size:14px}
.lok{margin-top:14px;padding:10px 14px;border-radius:12px;font-size:14px;font-weight:600}
.lok-ok{background:var(--ok-bg);color:var(--ok)}.lok-bad{background:var(--bad-bg);color:var(--bad)}.lok-warn{background:var(--warn-bg);color:var(--warn)}.lok-info{background:var(--info-bg);color:var(--info)}
.uji{margin-top:16px;font-size:13px;color:var(--muted)}.uji summary{cursor:pointer;font-weight:600}
.toplist{margin:6px 0 0;padding-left:18px;font-size:13.5px}.toplist li{margin:2px 0}.toplist em{font-style:normal;font-weight:700;color:var(--bad);margin-left:4px}

/* Penilaian */
.grp-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:20px 0 10px}
.grp-head h3{margin:0;font-size:16px}
.pn select{padding:5px 6px;font-size:13.5px;border-radius:8px}
.pn td{vertical-align:top}
.ref{display:block;margin-top:4px}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:12.5px;color:var(--muted);margin:8px 0 0}
.matrix td,.matrix th{text-align:center}.matrix td:first-child,.matrix th:first-child{text-align:left}
.dot{display:inline-block;width:12px;height:12px;border-radius:4px}
.d-done{background:var(--ok)}.d-prog{background:var(--warn)}.d-not{background:var(--line)}

/* Modal & toast */
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-start;justify-content:center;padding:6vh 14px;background:rgba(5,20,13,.55);overflow:auto}
.modal.open{display:flex}
.modal-box{background:var(--card);border-radius:18px;width:min(720px,100%);padding:22px;border:1px solid var(--line)}
.modal-box h2{margin:0 0 4px;font-size:19px}
.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}
.x{border:0;background:transparent;font-size:22px;line-height:1;padding:4px 8px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:16px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--hg-deep);color:#fff;padding:10px 18px;border-radius:12px;font-weight:600;font-size:14px;z-index:60;display:none;max-width:90vw}
.toast.show{display:block}
.toast.err{background:var(--bad)}
.receipt{width:100%;max-width:260px;border-radius:12px;border:1px solid var(--line)}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:14px}.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600}
.split{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:start}
.note{background:var(--info-bg);color:var(--info);border-radius:12px;padding:10px 14px;font-size:13.5px;margin-bottom:14px}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:13.5px}
.big-check{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.clock{font-size:40px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.area-pick{display:flex;flex-wrap:wrap;gap:6px}
.area-pick label{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:999px;font-size:13.5px;background:var(--field);cursor:pointer}
.area-pick input{margin:0}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(290px,86vw);height:auto;z-index:45;transform:translateX(-105%);transition:transform .2s ease;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  body.nav-open .side{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:44}
  .menu-btn{display:inline-flex}
  .top h1{font-size:20px}
  .bar{grid-template-columns:78px 1fr 112px}
  .split{grid-template-columns:1fr}
  .absen{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.mx td,.mx th{text-align:center;vertical-align:middle}.mx td:first-child,.mx th:first-child{text-align:left}
input.big{width:20px;height:20px;accent-color:var(--hg-500);cursor:pointer}
code{font-size:13px;background:var(--hg-50);padding:2px 6px;border-radius:6px;border:1px solid var(--line)}
.brand-mark.bo{background:#fff;color:var(--hg-deep)}
body::before{background:var(--hg-deep)}
.tabs a.tab-link{display:inline-block;padding:7px 14px;border-radius:9px;font-weight:700;color:var(--muted);text-decoration:none}
.tabs a.tab-link[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pager{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-top:10px}
.brand-logo{height:34px;width:auto;display:block}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side" aria-label="Menu utama">
    <div class="brand"><img class="brand-logo" src="/shared/logo-putih.png" alt="Healthy Go"><div><b>Backoffice</b><small>All divisi</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><div class="me" id="meBox"></div><a href="/?portal=1">Kembali ke portal</a><a href="#" id="logoutLink">Keluar</a></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main><div class="top"><button class="menu-btn" id="menuBtn" aria-label="Buka menu">☰</button><h1 id="pageTitle">Backoffice</h1></div><div id="view"><div class="card empty">Memuat…</div></div></main>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="modal-box" id="modalBox"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/shared/config.js"></script>
<script src="/shared/auth.js"></script>
<script>
/* Tabel profesional: header beku, scroll, sort lewat panah di kanan judul kolom */
const TBL = {};
function dataTable(id, cols, rows, opt = {}) {
  const st = TBL[id] || (TBL[id] = { key: opt.sortKey || cols[0].key, dir: opt.sortDir || 'asc', page: 0 });
  const col = cols.find(c => c.key === st.key) || cols[0];
  const val = r => col.sort ? col.sort(r) : r[col.key];
  const sorted = [...rows].sort((a, b) => {
    const x = val(a), y = val(b);
    if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
    const c = typeof x === 'string' ? x.localeCompare(y, 'id', { numeric: true }) : x - y;
    return st.dir === 'asc' ? c : -c;
  });
  const size = opt.pageSize || 0, pages = size ? Math.max(1, Math.ceil(sorted.length / size)) : 1;
  if ((st.page || 0) >= pages) st.page = pages - 1; if (!st.page || st.page < 0) st.page = st.page > 0 ? st.page : 0;
  const shown = size ? sorted.slice(st.page * size, st.page * size + size) : sorted;
  const arrow = c => st.key !== c.key ? '<span class="arr idle">▲▼</span>' : `<span class="arr">${st.dir === 'asc' ? '▲' : '▼'}</span>`;
  const pager = size && sorted.length > size ? `<div class="pager" data-pg="${id}"><span class="small muted">${(st.page * size + 1).toLocaleString('id-ID')}–${Math.min(sorted.length, st.page * size + size).toLocaleString('id-ID')} dari ${sorted.length.toLocaleString('id-ID')}</span><span class="row" style="gap:6px"><button class="btn-sm" data-pgo="first" ${st.page ? '' : 'disabled'}>«</button><button class="btn-sm" data-pgo="prev" ${st.page ? '' : 'disabled'}>‹ Sebelumnya</button><span class="small">Hal ${st.page + 1} / ${pages}</span><button class="btn-sm" data-pgo="next" ${st.page < pages - 1 ? '' : 'disabled'}>Berikutnya ›</button><button class="btn-sm" data-pgo="last" ${st.page < pages - 1 ? '' : 'disabled'}>»</button></span></div>` : '';
  st.pages = pages;
  return `<div class="tbl-wrap tbl-scroll" style="max-height:${opt.maxHeight || 520}px"><table class="dt${opt.freezeFirst ? ' freeze' : ''}" data-dt="${id}">
    <thead><tr>${cols.map(c => `<th class="${c.num ? 'num' : ''}" aria-sort="${st.key === c.key ? (st.dir === 'asc' ? 'ascending' : 'descending') : 'none'}"><button type="button" class="th-sort" data-sort="${c.key}" title="Urutkan ${esc(c.label)}"><span>${c.label}</span>${arrow(c)}</button></th>`).join('')}</tr></thead>
    <tbody>${shown.map(r => `<tr ${opt.rowAttr ? opt.rowAttr(r) : ''}>${cols.map(c => `<td class="${c.num ? 'num' : ''}${c.wrap ? ' wrap' : ''}">${c.render ? c.render(r) : esc(r[c.key])}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${cols.length}" class="empty">${opt.empty || 'Tidak ada data.'}</td></tr>`}</tbody>
  </table></div>${pager}`;
}
function bindDataTable(root, id, redraw) {
  root.querySelectorAll(`table[data-dt="${id}"] [data-sort]`).forEach(b => b.onclick = () => {
    const st = TBL[id];
    if (st.key === b.dataset.sort) st.dir = st.dir === 'asc' ? 'desc' : 'asc';
    else { st.key = b.dataset.sort; st.dir = b.closest('th').classList.contains('num') ? 'desc' : 'asc'; }
    st.page = 0; redraw();
  });

  });
}

const XLSX_LITE = (() => {
  const enc = new TextEncoder();
  const T = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; T[n] = c >>> 0; }
  const crc32 = b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = T[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  function zip(files) {
    const parts = [], central = []; let off = 0;
    files.forEach(f => {
      const name = enc.encode(f.name), data = enc.encode(f.data), crc = crc32(data), sz = data.length;
      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(12, 0x21, true);
      h.setUint32(14, crc, true); h.setUint32(18, sz, true); h.setUint32(22, sz, true); h.setUint16(26, name.length, true);
      parts.push(new Uint8Array(h.buffer), name, data);
      const c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(14, 0x21, true);
      c.setUint32(16, crc, true); c.setUint32(20, sz, true); c.setUint32(24, sz, true); c.setUint16(28, name.length, true); c.setUint32(42, off, true);
      central.push(new Uint8Array(c.buffer), name);
      off += 30 + name.length + sz;
    });
    const cd = central.reduce((a, b) => a + b.length, 0), e = new DataView(new ArrayBuffer(22));
    e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, cd, true); e.setUint32(16, off, true);
    return new Blob([...parts, ...central, new Uint8Array(e.buffer)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }
  const x = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');
  const col = i => { let s = ''; i++; while (i) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };
  const serial = iso => { const [y, m, d] = iso.split('-').map(Number); return (Date.UTC(y, m - 1, d) - Date.UTC(1899, 11, 30)) / 86400000; };
  const STYLE = { num: 0, pct: 3, rp: 4, date: 2 };
  function sheet(sh) {
    const cs = sh.columns, n = sh.rows.length;
    const head = `<row r="1">${cs.map((c, i) => `<c r="${col(i)}1" t="inlineStr" s="1"><is><t>${x(c.label)}</t></is></c>`).join('')}</row>`;
    const body = sh.rows.map((r, ri) => `<row r="${ri + 2}">${r.map((v, ci) => {
      if (v == null || v === '') return '';
      const ref = col(ci) + (ri + 2), t = cs[ci].type || 'text';
      if (t === 'date') return `<c r="${ref}" s="2"><v>${serial(v)}</v></c>`;
      if (t in STYLE) return `<c r="${ref}" s="${STYLE[t]}"><v>${Number(v)}</v></c>`;
      return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${x(v)}</t></is></c>`;
    }).join('')}</row>`).join('');
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0">${sh.freeze === false ? '' : '<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/>'}</sheetView></sheetViews><cols>${cs.map((c, i) => `<col min="${i + 1}" max="${i + 1}" width="${c.width || 14}" customWidth="1"/>`).join('')}</cols><sheetData>${head}${body}</sheetData>${n && sh.filter !== false ? `<autoFilter ref="A1:${col(cs.length - 1)}${n + 1}"/>` : ''}</worksheet>`;
  }
  function download(filename, sheets) {
    const ns = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main', rel = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
    const names = sheets.map(s => s.name.replace(/[\\\/\?\*\[\]:]/g, ' ').slice(0, 31));
    const defs = sheets.map((s, i) => s.rows.length && s.filter !== false ? `<definedName name="_xlnm._FilterDatabase" localSheetId="${i}" hidden="1">'${x(names[i])}'!$A$1:$${col(s.columns.length - 1)}$${s.rows.length + 1}</definedName>` : '').join('');
    const files = [
      { name: '[Content_Types].xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>` },
      { name: '_rels/.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${rel}/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
      { name: 'xl/workbook.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="${ns}" xmlns:r="${rel}"><sheets>${names.map((n, i) => `<sheet name="${x(n)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets>${defs ? `<definedNames>${defs}</definedNames>` : ''}</workbook>` },
      { name: 'xl/_rels/workbook.xml.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s, i) => `<Relationship Id="rId${i + 1}" Type="${rel}/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length + 1}" Type="${rel}/styles" Target="styles.xml"/></Relationships>` },
      { name: 'xl/styles.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="${ns}"><numFmts count="2"><numFmt numFmtId="164" formatCode="dd/mm/yyyy"/><numFmt numFmtId="165" formatCode="&quot;Rp&quot; #,##0"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF074B34"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="5"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="10" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="165" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>` },
      ...sheets.map((s, i) => ({ name: `xl/worksheets/sheet${i + 1}.xml`, data: sheet(s) }))

    const url = URL.createObjectURL(zip(files)), a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();

})();

/* ---------- Data ---------- */
async function q(p) { const { data, error } = await p; if (error) throw new Error(error.message); return data; }
async function fetchAll(make) { let out = [], from = 0; for (;;) { const { data, error } = await make().range(from, from + 999); if (error) throw new Error(error.message); out = out.concat(data); if (data.length < 1000 || from > 300000) break; from += 1000; } return out; }
async function loadAll() {
  const [d, p, pd, a, ra, rl, ex, pr] = await Promise.all([
    q(sb.from('divisions').select('*').order('nama')),
    q(sb.from('positions').select('*').order('urutan')),
    q(sb.from('position_divisions').select('*')),
    q(sb.from('apps').select('*').order('urutan')),
    q(sb.from('role_app_access').select('*')),
    q(sb.from('role_landing').select('*')),
    fetchAll(() => sb.from('user_app_exceptions').select('*').order('created_at', { ascending: false })),
    fetchAll(() => sb.from('profiles').select('id, nama, username, email, division_id, position_id, kontrak, aktif, created_at').order('id'))
  ]);
  Object.assign(ORG, { divisions: d, positions: p, posDiv: pd, apps: a, access: ra, landing: rl, exceptions: ex, profiles: pr });
}
/** Panggil Edge Function admin-akun dan tampilkan pesan error yang jelas. */
async function fnAkun(body) {
  const { data, error } = await sb.functions.invoke('admin-akun', { body });
  if (error) {
    let m = error.message;
    try { const j = await error.context.json(); if (j && j.error) m = j.error; } catch (_) { }
    if (/Failed to send|fetch/i.test(m)) m = 'Edge Function admin-akun belum terpasang atau tidak bisa dihubungi.';
    throw new Error(m);
  }
  if (data && data.error) throw new Error(data.error);
  return data;
}

/* Cerminan boleh_akses() untuk TAMPILAN saja (keputusan sebenarnya tetap di database). */
function cekAkses(u, appId) {
  const a = app(appId);
  if (!u.aktif) return { ok: false, alasan: 'Akun nonaktif' };
  if (!a.aktif) return { ok: false, alasan: 'Aplikasi nonaktif' };
  const ex = ORG.exceptions.find(e => e.profile_id === u.id && e.app_id === appId);
  if (ex) return { ok: ex.izinkan, alasan: (ex.izinkan ? 'Pengecualian: diizinkan' : 'Pengecualian: diblokir') + ' (' + ex.alasan + ')' };
  if (pos(u.position_id).cakupan === 'semua') return { ok: true, alasan: 'Jabatan dengan cakupan all divisi' };
  if (ORG.access.some(x => x.division_id === u.division_id && x.position_id === u.position_id && x.app_id === appId)) return { ok: true, alasan: 'Matriks: ' + (div(u.division_id).nama || '') + ' · ' + (pos(u.position_id).nama || '') };
  return { ok: false, alasan: 'Tidak ada di matriks akses' };
}
const appsUser = u => ORG.apps.filter(a => cekAkses(u, a.id).ok);
function landingUser(u) {
  const list = appsUser(u); if (!list.length) return null; if (list.length === 1) return list[0];
  const l = ORG.landing.find(x => x.division_id === u.division_id && x.position_id === u.position_id);
  return l && list.some(a => a.id === l.app_id) ? app(l.app_id) : null;
}

}

    <label class="f" id="fDivWrap"><span>Divisi</span><select id="fDiv"></select></label>
    <label class="f"><span>Kontrak</span><select id="fKon"><option value="">—</option>${['Full Time', 'Part Time'].map(k => opt(k, k, p.kontrak)).join('')}</select></label>
    <label class="f"><span>Email (opsional)</span><input id="fEmail" type="email" value="${esc(p.email || '')}" placeholder="Bisa dipakai untuk login"></label>
    ${id ? '' : `<label class="f"><span>Password (opsional)</span><input id="fPw" type="text" placeholder="Min. 8 karakter"></label>`}
  </div>
  <div class="note" id="fPrev" style="margin:14px 0 0"></div>
  <div class="actions"><button data-close>Batal</button><button class="btn-primary" id="fSave">${id ? 'Simpan perubahan' : 'Buat akun'}</button></div>`);
  const sync = () => {
    const j = pos($('#fJab').value), cur = $('#fDiv').value || p.division_id;
    $('#fDivWrap').hidden = j.cakupan === 'semua';
    $('#fDiv').innerHTML = '<option value="">Pilih divisi</option>' + ORG.divisions.filter(d => !j.id || posDivs(j.id).includes(d.id)).map(d => opt(d.id, d.nama, cur)).join('');
    const temp = { id: '__p', aktif: true, position_id: $('#fJab').value, division_id: j.cakupan === 'semua' ? null : $('#fDiv').value };
    const list = temp.position_id ? appsUser(temp) : [], l = temp.position_id ? landingUser(temp) : null;
    $('#fPrev').innerHTML = !temp.position_id ? 'Pilih jabatan untuk melihat aplikasi yang akan bisa dibuka.' : list.length ? `<b>Akan bisa membuka:</b> ${list.map(a => esc(a.nama)).join(', ')}. ${l ? 'Setelah login langsung ke <b>' + esc(l.nama) + '</b>.' : 'Setelah login melihat portal.'}` : 'Kombinasi divisi dan jabatan ini belum punya akses aplikasi. Atur di Matriks akses.';
  };
  $('#fJab').onchange = sync; $('#fDiv').onchange = sync; sync();
  $('#fNama').oninput = e => { if (!id) $('#fUser').value = e.target.value.trim().toLowerCase().replace(/[^a-z0-9]+/g, '.').replace(/^\.|\.$/g, ''); };
  $('#fSave').onclick = () => run($('#fSave'), async () => {
    const j = pos($('#fJab').value);
    if (!j.id) throw new Error('Pilih jabatan.');
    if (j.cakupan === 'divisi' && !$('#fDiv').value) throw new Error('Pilih divisi.');
    const body = { nama: $('#fNama').value, username: $('#fUser').value.trim().toLowerCase(), position_id: j.id, division_id: j.cakupan === 'semua' ? null : $('#fDiv').value, kontrak: $('#fKon').value || null, email: $('#fEmail').value.trim().toLowerCase() || null };
    if (id) {
      await fnAkun({ action: 'update', id, ...body }); await loadAll(); closeModal(); toast('Akun diperbarui.'); after();
    } else {
      const r = await fnAkun({ action: 'create', ...body, password: $('#fPw').value || undefined });
      await loadAll(); after();
      if (r.password_sementara) showPassword('Akun dibuat', body.nama, body.username + (body.email ? ' atau ' + body.email : ''), r.password_sementara);
      else { closeModal(); toast('Akun ' + body.nama + ' dibuat.'); }
    }
  });
}
function cekAksesModal(id) {

  openModal(`${modalHead('Cek akses: ' + p.nama, `${p.division_id ? esc(div(p.division_id).nama) : 'All divisi'} · ${esc(pos(p.position_id).nama)} · ${p.aktif ? 'aktif' : 'nonaktif'}`)}
  <div class="note">${l ? 'Setelah login, langsung diarahkan ke <b>' + esc(l.nama) + '</b>.' : appsUser(p).length ? 'Setelah login, melihat portal.' : 'Tidak bisa membuka aplikasi apa pun.'}</div>
  <div class="tbl-wrap"><table><thead><tr><th>Aplikasi</th><th>Divisi</th><th>Akses</th><th>Alasan</th></tr></thead><tbody>
  ${ORG.apps.map(a => { const c = cekAkses(p, a.id); return `<tr><td><b>${esc(a.nama)}</b><br><span class="small muted">${esc(a.url)}</span></td><td>${divLabel(a.division_id)}</td><td>${c.ok ? '<span class="chip c-ok">Boleh</span>' : '<span class="chip c-mute">Tidak</span>'}</td><td class="small wrap">${esc(c.alasan)}</td></tr>`; }).join('')}
  </tbody></table></div>`);

/* ---------- Matriks ---------- */
let MDiv = null;
function pageMatriks(v) {
  if (!div(MDiv).id) MDiv = (ORG.divisions[0] || {}).id;
  if (!MDiv) { v.innerHTML = '<div class="card empty">Belum ada divisi. Tambahkan di Master data.</div>'; return; }
  const apps = ORG.apps.filter(a => a.division_id === MDiv), jabs = ORG.positions.filter(j => j.cakupan === 'divisi' && posDivs(j.id).includes(MDiv));
  const has = (j, a) => ORG.access.some(x => x.division_id === MDiv && x.position_id === j && x.app_id === a);
  const land = j => (ORG.landing.find(x => x.division_id === MDiv && x.position_id === j) || {}).app_id;
  const count = j => ORG.profiles.filter(p => p.aktif && p.division_id === MDiv && p.position_id === j).length;
  v.innerHTML = `<div class="tabs" role="tablist">${ORG.divisions.map(d => `<button role="tab" aria-selected="${MDiv === d.id}" data-d="${d.id}">${esc(d.nama)}</button>`).join('')}</div>
  <div class="card"><h2>Matriks akses ${esc(div(MDiv).nama)}</h2><p class="sub">Centang aplikasi yang boleh dibuka tiap jabatan. Aplikasi utama = langsung dibuka setelah login; pilih Portal kalau orangnya perlu memilih.</p>
  ${apps.length && jabs.length ? `<div class="tbl-wrap"><table class="mx"><thead><tr><th>Jabatan</th>${apps.map(a => `<th>${esc(a.nama)}<br><span class="small muted" style="font-weight:500">${esc(a.url)}</span></th>`).join('')}<th>Aplikasi utama</th></tr></thead><tbody>
  ${jabs.map(j => `<tr data-j="${j.id}"><td><b>${esc(j.nama)}</b><br><span class="small muted">${count(j.id)} orang aktif</span></td>${apps.map(a => `<td><input type="checkbox" class="big" data-a="${a.id}" ${has(j.id, a.id) ? 'checked' : ''} aria-label="${esc(j.nama)} boleh membuka ${esc(a.nama)}"></td>`).join('')}
  <td><select data-utama><option value="">Portal</option>${apps.map(a => opt(a.id, a.nama, land(j.id))).join('')}</select></td></tr>`).join('')}
  </tbody></table></div><div class="actions"><button class="btn-primary" id="mxSave">Simpan matriks</button></div>`
      : `<div class="empty">${!apps.length ? 'Divisi ini belum punya aplikasi. Tambahkan di Master data → Aplikasi.' : 'Belum ada jabatan untuk divisi ini. Atur di Master data → Jabatan.'}</div>`}</div>
  <div class="card"><h2>Jabatan lintas divisi</h2><p class="sub">Otomatis bisa membuka semua aplikasi, termasuk Backoffice.</p>${ORG.positions.filter(j => j.cakupan === 'semua').map(j => `<span class="chip c-info" style="margin-right:6px">${esc(j.nama)} · ${ORG.profiles.filter(p => p.aktif && p.position_id === j.id).length} orang</span>`).join('')}</div>`;
  v.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { MDiv = b.dataset.d; pageMatriks(v); });
  v.querySelectorAll('tr[data-j]').forEach(tr => { const u = tr.querySelector('[data-utama]'); tr.querySelectorAll('[data-a]').forEach(c => c.onchange = () => { if (!c.checked && u.value === c.dataset.a) u.value = ''; }); u.onchange = () => { if (u.value) tr.querySelector(`[data-a="${u.value}"]`).checked = true; }; });
  const s = $('#mxSave'); if (s) s.onclick = () => run(s, async () => {
    const rows = [...v.querySelectorAll('tr[data-j]')];
    const akses = rows.flatMap(tr => [...tr.querySelectorAll('[data-a]:checked')].map(c => ({ position_id: tr.dataset.j, app_id: c.dataset.a })));
    const landing = rows.map(tr => ({ position_id: tr.dataset.j, app_id: tr.querySelector('[data-utama]').value })).filter(x => x.app_id);
    await q(sb.rpc('simpan_matriks', { p_divisi: MDiv, p_akses: akses, p_landing: landing }));
    await loadAll(); toast('Matriks ' + div(MDiv).nama + ' tersimpan.'); pageMatriks(v);
  });
}

/* ---------- Pengecualian ---------- */
function pagePengecualian(v) {
  const rows = ORG.exceptions.map(e => ({ ...e, nama: prof(e.profile_id).nama || '(akun dihapus)', appNama: app(e.app_id).nama }));
  const cols = [
    { key: 'nama', label: 'Nama', render: r => `<b>${esc(r.nama)}</b>` },
    { key: 'appNama', label: 'Aplikasi' },
    { key: 'izinkan', label: 'Jenis', sort: r => r.izinkan ? 1 : 0, render: r => r.izinkan ? '<span class="chip c-ok">Diizinkan</span>' : '<span class="chip c-bad">Diblokir</span>' },
    { key: 'alasan', label: 'Alasan', wrap: true },
    { key: 'created_at', label: 'Dibuat', render: r => fmtDate(r.created_at) },
    { key: 'aksi', label: '', sort: () => 0, render: r => `<button class="btn-sm btn-danger" data-del="${r.id}">Hapus</button>` }
  ];
  v.innerHTML = `<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:12px"><div><h2>Pengecualian per orang</h2><p class="sub" style="margin:0">Memberi akses tambahan atau memblokir akses dari jabatan. Pengecualian mengalahkan matriks.</p></div><button class="btn-primary" id="exAdd">Tambah pengecualian</button></div>
  ${dataTable('exc', cols, rows, { sortKey: 'created_at', sortDir: 'desc', empty: 'Belum ada pengecualian.' })}</div>`;
  bindDataTable(v, 'exc', () => pagePengecualian(v));
  v.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    const e = ORG.exceptions.find(x => String(x.id) === b.dataset.del);
    if (!confirm('Hapus pengecualian ini? Aksesnya kembali mengikuti matriks.')) return;
    run(b, async () => { await q(sb.from('user_app_exceptions').delete().eq('id', e.id)); await loadAll(); toast('Pengecualian dihapus.'); pagePengecualian(v); });
  });
  $('#exAdd').onclick = () => {
    openModal(`${modalHead('Tambah pengecualian')}
    <div class="form-grid">
      <label class="f"><span>Orang</span><input id="exQ" list="exPeople" placeholder="Ketik nama"><datalist id="exPeople">${ORG.profiles.filter(p => p.aktif).map(p => `<option value="${esc(p.nama)}">`).join('')}</datalist></label>
      <label class="f"><span>Aplikasi</span><select id="exApp"><option value="">Pilih aplikasi</option>${ORG.apps.map(a => opt(a.id, a.nama + (a.division_id ? ' · ' + (div(a.division_id).nama || '') : ' · All divisi'))).join('')}</select></label>
      <label class="f"><span>Jenis</span><select id="exType"><option value="1">Izinkan</option><option value="0">Blokir</option></select></label>
    </div>
    <label class="f" style="margin-top:12px"><span>Alasan</span><textarea id="exWhy" rows="2"></textarea></label>
    <div class="note" id="exPrev" style="margin:12px 0 0">Pilih orang dan aplikasi untuk melihat aksesnya saat ini.</div>
    <div class="actions"><button data-close>Batal</button><button class="btn-primary" id="exSave">Simpan</button></div>`);
    const who = () => ORG.profiles.find(p => normName(p.nama) === normName($('#exQ').value));
    const prev = () => { const p = who(), a = $('#exApp').value; $('#exPrev').textContent = p && a ? `Saat ini ${p.nama} ${cekAkses(p, a).ok ? 'BISA' : 'TIDAK bisa'} membuka ${app(a).nama} (${cekAkses(p, a).alasan}).` : 'Pilih orang dan aplikasi untuk melihat aksesnya saat ini.'; };
    $('#exQ').oninput = prev; $('#exApp').onchange = prev;
    $('#exSave').onclick = () => run($('#exSave'), async () => {
      const p = who(); if (!p) throw new Error('Nama tidak ditemukan. Pilih dari daftar.');
      if (!$('#exApp').value) throw new Error('Pilih aplikasi.');
      if (!$('#exWhy').value.trim()) throw new Error('Tulis alasannya.');
      if (p.id === ME.id && $('#exApp').value === 'backoffice' && $('#exType').value === '0') throw new Error('Anda tidak bisa memblokir Backoffice untuk diri sendiri.');
      const { error } = await sb.from('user_app_exceptions').insert({ profile_id: p.id, app_id: $('#exApp').value, izinkan: $('#exType').value === '1', alasan: $('#exWhy').value.trim(), created_by: ME.id });
      if (error) throw new Error(/duplicate|unique/i.test(error.message) ? 'Pengecualian untuk orang dan aplikasi ini sudah ada.' : error.message);
      await loadAll(); closeModal(); toast('Pengecualian disimpan.'); pagePengecualian(v);
    });
  };
}

    out.querySelectorAll('[data-dvd]').forEach(b => b.onclick = () => { const d = div(b.dataset.dvd);
      if (ORG.profiles.some(p => p.division_id === d.id)) return toast(`Divisi ${d.nama} masih punya akun. Pindahkan atau hapus akunnya dulu.`, true);
      if (ORG.apps.some(a => a.division_id === d.id)) return toast(`Divisi ${d.nama} masih punya aplikasi. Hapus atau pindahkan aplikasinya dulu.`, true);
      if (!confirm(`Hapus divisi ${d.nama}? Matriks akses divisi ini ikut terhapus.`)) return;
      run(b, async () => { const { error } = await sb.from('divisions').delete().eq('id', d.id); if (error) throw new Error(/foreign key|violates/i.test(error.message) ? 'Divisi masih dipakai data lain.' : error.message); await loadAll(); toast('Divisi dihapus.'); redraw(); }); });

const IMP = { rows: [], defDiv: 'DLV', defBranch: '', hasil: null };
const keyOf = s => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
const KOLOM = {
  nama: ['nama', 'name', 'namalengkap', 'namakaryawan', 'namakurir'], username: ['username', 'user'], email: ['email', 'surel'],
  jabatan: ['jabatan', 'posisi', 'position', 'jabatanposisi', 'role'], divisi: ['divisi', 'division', 'dept', 'departemen'],
  area: ['area'], branch: ['branch', 'cabang'], kontrak: ['kontrak', 'statuskaryawan', 'jeniskontrak', 'status']
};
function parseCSV(text) {
  text = text.replace(/^\uFEFF/, '');
  const first = text.split(/\r?\n/)[0] || '', cnt = c => (first.match(new RegExp('\\' + c, 'g')) || []).length;
  const d = cnt('\t') > cnt(',') && cnt('\t') > cnt(';') ? '\t' : cnt(';') > cnt(',') ? ';' : ',';
  const rows = []; let row = [], f = '', qt = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (qt) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else qt = false; } else f += ch; }
    else if (ch === '"') qt = true;
    else if (ch === d) { row.push(f); f = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += ch;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}
const kontrakOf = v => { const k = keyOf(v); return /^(fulltime|ft|full)$/.test(k) ? 'Full Time' : /^(parttime|pt|part)$/.test(k) ? 'Part Time' : null; };
const posOf = v => { const k = keyOf(v); return ORG.positions.find(p => keyOf(p.id) === k || keyOf(p.nama) === k) || null; };
const divOf = v => { const k = keyOf(v); return k ? ORG.divisions.find(d => keyOf(d.id) === k || keyOf(d.nama) === k) || null : null; };
const userFrom = nama => normName(nama).replace(/[^a-z0-9]+/g, '.').replace(/^\.+|\.+$/g, '').slice(0, 36) || 'user';

function siapkan() {
  const out = $('#impOut'), raw = IMP.raw;

  const ada = new Set(ORG.profiles.map(p => normName(p.nama))), adaUser = new Set(ORG.profiles.map(p => p.username)), diFile = new Set(), userFile = new Set();
  const brNama = id => (IMP.branches.find(b => b.id === id) || {}).nama || '';
  const areaAda = new Map(IMP.areas.map(a => [normName(brNama(a.branch_id)) + '|' + normName(a.nama), a])), brAda = new Map(IMP.branches.map(b => [normName(b.nama), b]));
  const areaDiBranch = nm => IMP.areas.filter(a => normName(a.nama) === normName(nm));

    const p = posOf(o.jabatanTeks); o.position_id = p ? p.id : null;
    const d = p && p.cakupan === 'semua' ? null : (divOf(o.divisiTeks) || div(IMP.defDiv)); o.division_id = d ? d.id : null;
    if (!o.nama) o.err = 'Nama kosong';
    else if (ada.has(normName(o.nama))) o.err = 'Sudah ada di sistem (dilewati)';
    else if (diFile.has(normName(o.nama))) o.err = 'Nama dobel di file';
    else if (!p) o.err = `Jabatan "${o.jabatanTeks}" tidak dikenal`;

      let u = o.username.length < 4 ? (o.username + '.hg').slice(0, 40) : o.username, n = 2; const base = u;

          if (!o.err && !areaAda.has(normName(o.branch) + '|' + normName(o.area))) { o.info.push('area baru'); if (!o.branch) o.err = 'Area baru butuh Branch (isi kolom Branch atau pilih Branch default)'; else if (!brAda.has(normName(o.branch))) o.info.push('branch baru'); }
        }

  const ok = IMP.rows.filter(r => !r.err), gagal = IMP.rows.filter(r => r.err);
  const cols = [

    { key: 'area', label: 'Area', render: r => esc(r.area || '—') + (r.area && r.branch ? `<br><span class="small muted">${esc(r.branch)}</span>` : '') }, { key: 'kontrak', label: 'Kontrak', render: r => esc(r.kontrak || '—') },

  ${dataTable('imp', cols, IMP.rows, { sortKey: 'status', maxHeight: 520 })}</div><div id="impRes"></div>`;
  bindDataTable(out, 'imp', siapkan);
  $('#impGo').onclick = () => { if (confirm(`Buat ${ok.length} akun sekarang? Proses bisa memakan beberapa menit; jangan tutup halaman.`)) jalankanImpor(ok); };
}
const uniqArr = a => [...new Set(a)];
async function jalankanImpor(rows) {
  const btn = $('#impGo'); btn.disabled = true;
  const prog = t => { btn.textContent = t; };
  try {
    // 1. Branch & area baru
    const brMap = new Map(IMP.branches.map(b => [normName(b.nama), b.id]));
    const needBr = uniqArr(rows.filter(r => r.info.includes('area baru')).map(r => r.branch).filter(b => b && !brMap.has(normName(b))));
    for (const b of needBr) { const x = await q(sb.from('dlv_branches').insert({ nama: b }).select('id').single()); brMap.set(normName(b), x.id); }
    const brNm = id => (IMP.branches.find(b => b.id === id) || {}).nama || '';
    const arMap = new Map(IMP.areas.map(a => [normName(brNm(a.branch_id)) + '|' + normName(a.nama), a.id])), seen = new Set();
    for (const r of rows.filter(r => r.info.includes('area baru'))) {
      const k = normName(r.branch) + '|' + normName(r.area); if (seen.has(k) || arMap.has(k)) continue; seen.add(k);
      const x = await q(sb.from('dlv_areas').insert({ nama: r.area, branch_id: brMap.get(normName(r.branch)) }).select('id').single()); arMap.set(k, x.id);
    }
    // 2. Akun (25 per panggilan)
    const hasil = [];
    for (let i = 0; i < rows.length; i += 25) {
      prog(`Membuat akun ${Math.min(i + 25, rows.length)} / ${rows.length}…`);
      const part = rows.slice(i, i + 25);
      const r = await fnAkun({ action: 'create_bulk', rows: part.map(o => ({ nama: o.nama, username: o.username, email: o.email || undefined, position_id: o.position_id, division_id: o.division_id, kontrak: o.kontrak })) });
      r.hasil.forEach((h, j) => hasil.push({ ...part[j], ...h }));
    }
    // 3. Penugasan area kurir
    prog('Menugaskan kurir ke area…');
    const kA = h => normName(h.branch) + '|' + normName(h.area);
    const tugas = hasil.filter(h => h.ok && h.position_id === 'kurir' && h.area && arMap.has(kA(h))).map(h => ({ profile_id: h.id, area_id: arMap.get(kA(h)), mulai: TODAY }));
    for (let i = 0; i < tugas.length; i += 500) await q(sb.from('dlv_penugasan').insert(tugas.slice(i, i + 500)));
    IMP.hasil = hasil; await loadAll();
    tampilHasil();
  } catch (e) { toast('Impor berhenti: ' + e.message, true); btn.disabled = false; btn.textContent = 'Coba lagi'; }
}
function tampilHasil() {
  const h = IMP.hasil, ok = h.filter(x => x.ok), bad = h.filter(x => !x.ok);
  $('#impRes').innerHTML = `<div class="card"><h2>Hasil impor</h2><div class="kpis"><div class="kpi lead"><span>Berhasil dibuat</span><b>${ok.length}</b></div><div class="kpi"><span>Gagal</span><b>${bad.length}</b></div></div>
  <div class="warnbox" style="margin-bottom:12px"><b>Unduh daftar password sekarang.</b> Password sementara hanya ditampilkan sekali dan tidak bisa dilihat lagi (bisa di-reset nanti).</div>
  <div class="actions" style="justify-content:flex-start"><button class="btn-primary" id="impXls">Unduh Excel username & password</button></div>
  ${bad.length ? `<h3 style="font-size:15px;margin:14px 0 8px">Yang gagal</h3><div class="tbl-wrap"><table><thead><tr><th>Baris</th><th>Nama</th><th>Alasan</th></tr></thead><tbody>${bad.map(b => `<tr><td>${b.baris}</td><td>${esc(b.nama)}</td><td class="wrap">${esc(b.error)}</td></tr>`).join('')}</tbody></table></div>` : ''}</div>`;
  $('#impXls').onclick = () => XLSX_LITE.download(`Akun baru ${TODAY}.xlsx`, [{ name: 'Akun baru', columns: [{ label: 'Nama', width: 26 }, { label: 'Jabatan', width: 14 }, { label: 'Divisi', width: 12 }, { label: 'Area', width: 14 }, { label: 'Username', width: 24 }, { label: 'Email', width: 26 }, { label: 'Password sementara', width: 20 }, { label: 'Status', width: 30 }],
    rows: h.map(x => [x.nama, x.jabatanTeks, x.division_id ? div(x.division_id).nama : 'Semua', x.area || '', x.ok ? x.username : '', x.email || '', x.ok ? x.password_sementara : '', x.ok ? 'Berhasil' : 'Gagal: ' + x.error]) },
    { name: 'Info', filter: false, freeze: false, columns: [{ label: 'Keterangan', width: 22 }, { label: 'Isi', width: 60 }], rows: [['Alamat login', location.origin], ['Cara login', 'Username (atau email kalau diisi) + password sementara'], ['Setelah login', 'Minta setiap orang mengganti password lewat menu Ganti password'], ['Dibuat oleh', ME.nama], ['Tanggal', fmtDate(new Date())]] }]);
}

/* ---------- Laporan absensi (semua divisi) ---------- */
async function inChunks(ids, make, size = 60) {
  let out = []; for (let i = 0; i < ids.length; i += size) out = out.concat(await fetchAll(() => make(ids.slice(i, i + size)))); return out;
}
const pd = n => String(n).padStart(2, '0'), isoD = d => d.getFullYear() + '-' + pd(d.getMonth() + 1) + '-' + pd(d.getDate());
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addD = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return isoD(d); };
const isoDow = s => ((parseD(s).getDay() + 6) % 7) + 1;
const NAMA_HARI = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
const LB = { dari: TODAY.slice(0, 8) + '01', sampai: TODAY, divisi: '', jab: '', area: '' };
async function pageLapAbsensi(v) {
  if (!LB.ref) {
    const [ses, pts, pg, ar, br] = await Promise.all([q(sb.from('attendance_sessions').select('*')), q(sb.from('attendance_points').select('id,nama')),
      fetchAll(() => sb.from('dlv_penugasan').select('*').order('id')), q(sb.from('dlv_areas').select('*').order('nama')), q(sb.from('dlv_branches').select('*'))]);
    LB.ref = { ses, pts, pg, ar, br };
  }
  const R0 = LB.ref, areaNm = id => (R0.ar.find(a => a.id === id) || {}).nama || '', brNm = id => (R0.br.find(b => b.id === id) || {}).nama || '';
  const areaOfP = pid => (R0.pg.find(x => x.profile_id === pid && !x.selesai) || {}).area_id || null;
  v.innerHTML = `<div class="card"><h2>Laporan absensi</h2><p class="sub">Semua divisi. Kurir wajib absen per sesi (Lunch, Dinner, Weekend) sejak ditugaskan ke area; jabatan lain wajib absen masuk setiap hari kerja. Absen di hari lain (mis. Minggu) ikut tercatat dan dihitung. Jam pulang kosong kalau hanya absen masuk. Maksimal 92 hari.</p>
    <div class="row">
      <label class="f"><span>Dari</span><input type="date" id="lbDari" value="${LB.dari}" max="${TODAY}"></label>
      <label class="f"><span>Sampai</span><input type="date" id="lbSampai" value="${LB.sampai}" max="${TODAY}"></label>
      <label class="f"><span>Divisi</span><select id="lbDiv"><option value="">Semua</option>${ORG.divisions.map(d => opt(d.id, d.nama, LB.divisi)).join('')}</select></label>
      <label class="f"><span>Jabatan</span><select id="lbJab"><option value="">Semua</option>${ORG.positions.filter(p => p.cakupan !== 'semua').map(p => opt(p.id, p.nama, LB.jab)).join('')}</select></label>
      <label class="f"><span>Area kurir</span><select id="lbArea"><option value="">Semua</option>${R0.ar.map(a => opt(a.id, a.nama + ' (' + brNm(a.branch_id) + ')', LB.area)).join('')}</select></label>
      <button class="btn-soft" id="lbShow">Tampilkan</button><button class="btn-primary" id="lbXls">Unduh Excel</button>
    </div></div><div id="lbRes"></div>`;
  const baca = () => {
    Object.assign(LB, { dari: $('#lbDari').value, sampai: $('#lbSampai').value, divisi: $('#lbDiv').value, jab: $('#lbJab').value, area: $('#lbArea').value });
    if (!LB.dari || !LB.sampai || LB.dari > LB.sampai) throw new Error('Tanggal "dari" harus sebelum "sampai".');
    if ((parseD(LB.sampai) - parseD(LB.dari)) / 864e5 > 92) throw new Error('Rentang maksimal 92 hari.');
  };
  const hitung = async () => {
    // Kandidat: semua akun aktif sesuai filter. Jabatan "All divisi" (Super Admin, GM) hanya tampil kalau memang pernah absen.
    const kandidat = ORG.profiles.filter(p => p.aktif && (!LB.divisi || p.division_id === LB.divisi) && (!LB.jab || p.position_id === LB.jab) && (!LB.area || (p.position_id === 'kurir' && areaOfP(p.id) === LB.area)));
    const abs = await inChunks(kandidat.map(p => p.id), x => sb.from('attendance').select('id,profile_id,tanggal,sesi,status,jam,point_id,jarak_m,catatan').in('profile_id', x).gte('tanggal', LB.dari).lte('tanggal', LB.sampai).order('id'));
    const punyaAbsen = new Set(abs.map(a => a.profile_id));
    const orang = kandidat.filter(p => pos(p.position_id).cakupan !== 'semua' || punyaAbsen.has(p.id));
    const idx = {}; abs.forEach(a => idx[a.profile_id + '|' + a.tanggal + '|' + a.sesi] = a);
    const sesHari = (u, d) => R0.ses.filter(s => s.untuk === u && s.hari.includes(isoDow(d)) && s.sesi !== 'Pulang').map(s => s.sesi);
    const baris = (p, d, s, a, wajib) => { const pl = s === 'Masuk' ? idx[p.id + '|' + d + '|Pulang'] : null;
      return { p, tanggal: d, sesi: s, wajib, status: a ? a.status : 'Tidak absen', jam: a && a.jam ? a.jam.slice(0, 5) : '', pulang: pl && pl.jam ? pl.jam.slice(0, 5) : '',
        titik: (a || pl) && (a || pl).point_id ? (R0.pts.find(t => t.id === (a || pl).point_id) || {}).nama || '' : '', jarak: a && a.jarak_m != null ? a.jarak_m : pl && pl.jarak_m != null ? pl.jarak_m : null,
        catatan: a ? a.catatan || '' : '' }; };
    const detail = [];
    orang.forEach(p => {
      const kur = p.position_id === 'kurir', global = pos(p.position_id).cakupan === 'semua';
      const mulai = kur ? (R0.pg.filter(x => x.profile_id === p.id).map(x => x.mulai).sort()[0] || LB.dari) : LB.dari;
      for (let d = LB.dari; d <= LB.sampai && d <= TODAY; d = addD(d, 1)) {
        const wajibList = global || d < mulai ? [] : sesHari(kur ? 'kurir' : 'staf', d);
        wajibList.forEach(s => { const a = idx[p.id + '|' + d + '|' + s]; const pl = s === 'Masuk' ? idx[p.id + '|' + d + '|Pulang'] : null; if (!a && !pl && d === TODAY) return; detail.push(baris(p, d, s, a, true)); });
        // Absen di hari di luar jadwal (mis. Minggu, atau Super Admin/GM) tetap tercatat DAN ikut dihitung
        const luar = uniqArr(abs.filter(a => a.profile_id === p.id && a.tanggal === d && a.sesi !== 'Pulang').map(a => a.sesi)).filter(s => !wajibList.includes(s));
        luar.forEach(s => detail.push(baris(p, d, s, idx[p.id + '|' + d + '|' + s], true)));
      }
    });
    const rekap = orang.map(p => { const r = detail.filter(x => x.p === p), w = r.filter(x => x.wajib), c = s => w.filter(x => x.status === s).length, ar = areaOfP(p.id);
      return { p, nama: p.nama, div: div(p.division_id).nama || 'All divisi', jab: pos(p.position_id).nama || '', area: areaNm(ar), branch: ar ? brNm((R0.ar.find(a => a.id === ar) || {}).branch_id) : '',
        wajib: w.length, hadir: c('Hadir'), izin: c('Izin'), sakit: c('Sakit'), tidak: c('Tidak absen'), pct: w.length ? c('Hadir') / w.length : null }; });
    return { orang, detail, rekap };
  };
  $('#lbShow').onclick = () => run($('#lbShow'), async () => {
    baca(); $('#lbRes').innerHTML = '<div class="card empty">Menghitung…</div>';
    const H = await hitung(), tot = s => H.detail.filter(x => x.wajib && x.status === s).length, w = H.detail.filter(x => x.wajib).length;
    const cols = [{ key: 'nama', label: 'Nama', render: r => `<b>${esc(r.nama)}</b>` }, { key: 'div', label: 'Divisi' }, { key: 'jab', label: 'Jabatan' }, { key: 'area', label: 'Area', render: r => esc(r.area) || '—' },
      { key: 'wajib', label: 'Wajib', num: true }, { key: 'hadir', label: 'Hadir', num: true }, { key: 'izin', label: 'Izin', num: true }, { key: 'sakit', label: 'Sakit', num: true },
      { key: 'tidak', label: 'Tidak absen', num: true, render: r => r.tidak ? `<span class="chip c-bad">${r.tidak}</span>` : '0' },
      { key: 'pct', label: '% hadir', num: true, render: r => r.pct == null ? '—' : `<span class="chip ${r.pct >= .95 ? 'c-ok' : r.pct >= .85 ? 'c-warn' : 'c-bad'}">${(r.pct * 100).toFixed(1)}%</span>` }];
    const draw = () => { $('#lbTbl').innerHTML = dataTable('lbabs', cols, H.rekap, { sortKey: 'pct', freezeFirst: true, pageSize: 50, empty: 'Tidak ada data.' }); bindDataTable($('#lbTbl'), 'lbabs', draw); };
    $('#lbRes').innerHTML = `<div class="kpis"><div class="kpi lead"><span>Kehadiran</span><b>${w ? (tot('Hadir') / w * 100).toFixed(1) + '%' : '—'}</b><small>${tot('Hadir').toLocaleString('id-ID')} dari ${w.toLocaleString('id-ID')} wajib absen</small></div><div class="kpi"><span>Orang</span><b>${H.orang.length}</b></div><div class="kpi"><span>Izin</span><b>${tot('Izin')}</b></div><div class="kpi"><span>Sakit</span><b>${tot('Sakit')}</b></div><div class="kpi"><span>Tidak absen</span><b>${tot('Tidak absen')}</b></div></div>
    <div class="card"><h2>Rekap per orang</h2><div id="lbTbl"></div></div>`;
    draw();
  });
  $('#lbXls').onclick = () => run($('#lbXls'), async () => {
    baca(); const H = await hitung(); if (!H.detail.length) throw new Error('Tidak ada data untuk diunduh.');
    XLSX_LITE.download(`Laporan Absensi ${LB.dari} sd ${LB.sampai}.xlsx`, [
      { name: 'Rekap per orang', columns: [{ label: 'Nama', width: 26 }, { label: 'Divisi', width: 12 }, { label: 'Jabatan', width: 14 }, { label: 'Branch', width: 14 }, { label: 'Area', width: 14 }, { label: 'Wajib absen', type: 'num', width: 12 }, { label: 'Hadir', type: 'num', width: 9 }, { label: 'Izin', type: 'num', width: 9 }, { label: 'Sakit', type: 'num', width: 9 }, { label: 'Tidak absen', type: 'num', width: 12 }, { label: '% Kehadiran', type: 'pct', width: 12 }],
        rows: H.rekap.sort((a, b) => a.div.localeCompare(b.div) || a.area.localeCompare(b.area) || a.nama.localeCompare(b.nama)).map(r => [r.nama, r.div, r.jab, r.branch, r.area, r.wajib, r.hadir, r.izin, r.sakit, r.tidak, r.pct]) },
      { name: 'Detail harian', columns: [{ label: 'Tanggal', type: 'date', width: 12 }, { label: 'Hari', width: 7 }, { label: 'Nama', width: 26 }, { label: 'Divisi', width: 12 }, { label: 'Jabatan', width: 14 }, { label: 'Area', width: 14 }, { label: 'Sesi', width: 10 }, { label: 'Status', width: 12 }, { label: 'Jam absen', width: 10 }, { label: 'Jam pulang', width: 10 }, { label: 'Titik', width: 20 }, { label: 'Jarak (m)', type: 'num', width: 10 }, { label: 'Catatan', width: 30 }],
        rows: H.detail.sort((a, b) => a.tanggal.localeCompare(b.tanggal) || a.p.nama.localeCompare(b.p.nama)).map(x => [x.tanggal, NAMA_HARI[parseD(x.tanggal).getDay()], x.p.nama, div(x.p.division_id).nama || 'All divisi', pos(x.p.position_id).nama || '', areaNm(areaOfP(x.p.id)), x.sesi, x.status, x.jam, x.pulang, x.titik, x.jarak, x.catatan]) },
      { name: 'Info', filter: false, freeze: false, columns: [{ label: 'Keterangan', width: 20 }, { label: 'Isi', width: 50 }], rows: [['Laporan', 'Absensi semua divisi'], ['Periode', LB.dari + ' s.d. ' + LB.sampai], ['Divisi', LB.divisi ? div(LB.divisi).nama : 'Semua'], ['Jabatan', LB.jab ? pos(LB.jab).nama : 'Semua'], ['Dibuat oleh', ME.nama], ['Dibuat pada', fmtDateTime(new Date())]] }
    ]);
    toast('Excel diunduh: ' + H.rekap.length + ' orang, ' + H.detail.length + ' baris.');
  });
}

/* ---------- Router (menu + sub menu) ---------- */
const SUB = {
  akun: [['daftar', 'Daftar akun', pageAkun], ['impor', 'Import CSV', pageImpor]],
  matriks: [['matriks', 'Matriks', pageMatriks], ['pengecualian', 'Pengecualian', pagePengecualian]],
  master: [['master', 'Master data', pageMaster]],
  laporan: [['sdm', 'Data SDM', pageLaporan], ['absensi', 'Absensi', pageLapAbsensi]],
  riwayat: [['riwayat', 'Riwayat aktivitas', pageRiwayat]]
};
const MENU = [['akun', 'Akun'], ['matriks', 'Matriks akses'], ['master', 'Master data'], ['laporan', 'Laporan'], ['riwayat', 'Riwayat aktivitas']];
const LAMA = { impor: 'akun/impor', pengecualian: 'matriks/pengecualian' };   // tautan lama tetap jalan
function render() {
  let [id, sub] = location.hash.slice(1).split('/');
  if (LAMA[id]) [id, sub] = LAMA[id].split('/');
  if (!SUB[id]) id = 'akun';
  const subs = SUB[id], cur = subs.find(s => s[0] === sub) || subs[0];
  $('#nav').innerHTML = MENU.map(([k, l]) => `<a href="#${k}" class="${k === id ? 'active' : ''}" ${k === id ? 'aria-current="page"' : ''}>${l}</a>`).join('');
  const judul = MENU.find(n => n[0] === id)[1];
  $('#pageTitle').textContent = judul; document.title = (subs.length > 1 ? cur[1] + ' · ' : '') + judul + ' · Backoffice';
  const v = $('#view');
  if (subs.length > 1) { v.innerHTML = `<div class="tabs" role="tablist">${subs.map(s => `<a role="tab" class="tab-link" aria-selected="${s === cur}" href="#${id}/${s[0]}">${s[1]}</a>`).join('')}</div><div id="subView"><div class="card empty">Memuat…</div></div>`; }
  else v.innerHTML = '<div id="subView"><div class="card empty">Memuat…</div></div>';
  Promise.resolve(cur[2]($('#subView'))).catch(e => { $('#subView').innerHTML = `<div class="card empty">Gagal memuat: ${esc(e.message)}</div>`; });
}
window.addEventListener('hashchange', () => { document.body.classList.remove('nav-open'); render(); window.scrollTo(0, 0); });
$('#menuBtn').onclick = () => document.body.classList.add('nav-open');
$('#scrim').onclick = () => document.body.classList.remove('nav-open');
$('#logoutLink').onclick = e => { e.preventDefault(); HGAuth.logout(); };

(async () => {
  const me = await HGAuth.guard('backoffice');
  ME = me.profile;
  $('#meBox').innerHTML = `<b>${esc(ME.nama)}</b>${esc(ME.positions ? ME.positions.nama : ME.position_id)}`;
  try { await loadAll(); } catch (e) { $('#view').innerHTML = `<div class="card empty">Gagal memuat data: ${esc(e.message)}</div>`; return; }
  render();
})();

</script>
