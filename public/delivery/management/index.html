<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Management Delivery · Healthy Go</title>
<link rel="icon" type="image/png" sizes="32x32" href="/shared/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/shared/favicon.png">
<link rel="apple-touch-icon" href="/shared/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

:root{--hg:#074b34;--hg-deep:#04331f;--hg-700:#0b5e41;--hg-500:#1d8a5b;--hg-100:#e3f1e8;--hg-50:#f1f7f3;--sun:#f3cf1b;
--bg:#f4f6f1;--card:#fff;--ink:#13241c;--muted:#5d6e65;--line:#dde6df;--field:#fff;
--ok:#167a43;--ok-bg:#e2f4e8;--warn:#9a5b00;--warn-bg:#fff2d3;--bad:#b4281c;--bad-bg:#fde7e4;--info:#1f5f99;--info-bg:#e6f0fb;
--radius:14px;--side:264px;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a15;--card:#16241d;--ink:#e6efe9;--muted:#9db0a5;--line:#2a3c33;--field:#1b2c24;
--hg-100:#1d3a2c;--hg-50:#18291f;--ok:#5fd08f;--ok-bg:#183a27;--warn:#f0b54a;--warn-bg:#3a2d12;--bad:#f2877b;--bad-bg:#3e1d19;--info:#8bbcf0;--info-bg:#18293d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a15;--card:#16241d;--ink:#e6efe9;--muted:#9db0a5;--line:#2a3c33;--field:#1b2c24;
--hg-100:#1d3a2c;--hg-50:#18291f;--ok:#5fd08f;--ok-bg:#183a27;--warn:#f0b54a;--warn-bg:#3a2d12;--bad:#f2877b;--bad-bg:#3e1d19;--info:#8bbcf0;--info-bg:#18293d;color-scheme:dark}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.btn-primary{background:var(--hg);border-color:var(--hg);color:#fff}
.btn-primary:hover{background:var(--hg-700)}
.btn-soft{background:var(--hg-50);border-color:var(--hg-100)}
.btn-danger{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
.btn-sm{padding:5px 10px;font-size:13px;border-radius:8px}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
label.f>input,label.f>select,label.f>textarea{color:var(--ink);font-weight:500;font-size:15px}

/* Prototype bar */
.proto{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:center;padding:7px 14px;background:var(--sun);color:#3b3000;font-size:13px;font-weight:600}
.proto select{padding:3px 8px;border-radius:8px;border:1px solid #c9a900;background:#fff8d6;color:#3b3000}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--sun)}

/* Layout */
.shell{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{background:var(--hg-deep);color:#e8f3ec;display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}
.brand-mark{width:38px;height:38px;border-radius:11px;background:var(--sun);color:var(--hg-deep);display:grid;place-items:center;font-weight:800;font-size:15px}
.brand b{display:block;font-size:15px}.brand small{color:#a9c9b6;font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:#d6e9dd;text-decoration:none;font-weight:600;font-size:14px}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a.active{background:var(--hg-700);color:#fff;box-shadow:inset 3px 0 0 var(--sun)}
.nav .grp{margin:14px 12px 4px;font-size:12px;color:#8fb59e;font-weight:600}
.side-foot{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:2px}
.side-foot a{color:#cfe4d7;text-decoration:none;font-size:13px;padding:7px 12px;border-radius:8px}
.side-foot a:hover{background:rgba(255,255,255,.07)}
.me{padding:10px 12px;font-size:13px;color:#a9c9b6}.me b{color:#fff;display:block;font-size:14px}
main{min-width:0;padding:22px clamp(14px,3vw,34px) 60px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.top h1{margin:0;font-size:24px;letter-spacing:-.01em}
.menu-btn{display:none}
.scrim{display:none}

/* Components */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.card+.card{margin-top:16px}
.card h2{margin:0 0 4px;font-size:17px}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.grow{flex:1 1 180px}
.tabs{display:inline-flex;gap:4px;padding:4px;background:var(--hg-50);border:1px solid var(--line);border-radius:12px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:9px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--hg-50);font-size:12.5px;color:var(--muted);font-weight:700;position:sticky;top:0;z-index:2}
.tbl-scroll{overflow:auto}
.th-sort{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:none;border:0;padding:0;border-radius:4px;font:inherit;font-weight:700;color:inherit;text-align:left}
th.num .th-sort span:first-child{margin-left:auto}
.th-sort:hover{color:var(--ink)}
.arr{font-size:9px;color:var(--hg-500);letter-spacing:-1px}.arr.idle{color:var(--line);font-size:8px}
.th-sort:hover .arr.idle{color:var(--muted)}
th[aria-sort="ascending"],th[aria-sort="descending"]{color:var(--ink)}
td.wrap{white-space:normal;min-width:260px;max-width:420px}
.freeze td:first-child,.freeze th:first-child{position:sticky;left:0;z-index:1;background:var(--card);box-shadow:1px 0 0 var(--line)}
.freeze th:first-child{z-index:3;background:var(--hg-50)}
tr.click:hover td{background:var(--hg-50)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover td{background:var(--hg-50)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.c-ok{background:var(--ok-bg);color:var(--ok)}.c-warn{background:var(--warn-bg);color:var(--warn)}.c-bad{background:var(--bad-bg);color:var(--bad)}.c-info{background:var(--info-bg);color:var(--info)}.c-mute{background:var(--hg-50);color:var(--muted);border:1px solid var(--line)}
.muted{color:var(--muted)}.small{font-size:12.5px}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* Dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:16px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.kpi span{display:block;font-size:13px;color:var(--muted);font-weight:600}
.kpi b{display:block;font-size:26px;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-size:12px}
.kpi.lead{background:var(--hg);border-color:var(--hg);color:#fff}.kpi.lead span,.kpi.lead small{color:#bfe0cc}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:110px 1fr 170px;gap:10px;align-items:center;font-size:13.5px}
.bar-track{height:12px;background:var(--hg-50);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.bar-fill{height:100%;background:var(--hg-500);border-radius:999px}
.bar-fill.w{background:var(--warn)}.bar-fill.b{background:var(--bad)}
.pct{display:inline-block;min-width:46px}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ms{position:relative}
.ms-btn{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;font-weight:500;background:var(--field);padding:7px 30px 7px 12px;position:relative}
.ms-btn::after{content:"▾";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.ms-btn[aria-expanded="true"]{border-color:var(--hg-500)}
.ms-lbl{font-size:12px;color:var(--muted);font-weight:600}
.ms-val{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ms-pop{position:absolute;z-index:25;top:calc(100% + 4px);left:0;min-width:100%;width:max-content;max-width:min(320px,86vw);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:8px}
.ms-list{max-height:270px;overflow:auto;display:flex;flex-direction:column}
.ms-list label{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:14px}
.ms-list label:hover{background:var(--hg-50)}
.ms-q{width:100%;margin-bottom:6px}
.ms-foot{border-top:1px solid var(--line);margin-top:6px;padding-top:6px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr));gap:16px}
.charts .card{margin:0}
.bar-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-fill.i{background:var(--info)}
.pie{display:flex;flex-wrap:wrap;gap:18px;align-items:center}
.pie-n{font-size:18px;font-weight:800;fill:var(--ink)}.pie-l{font-size:12px;fill:var(--muted)}
.pie-legend{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14px;flex:1 1 160px}
.pie-legend li{display:grid;grid-template-columns:12px 1fr auto auto;gap:8px;align-items:center}
.sw{width:12px;height:12px;border-radius:4px}
.absen{display:grid;grid-template-columns:minmax(0,420px) 1fr;gap:22px;align-items:start}
.cam-box{position:relative;aspect-ratio:4/3;background:#0b1712;border-radius:14px;overflow:hidden}
.cam-box video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam-msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:#dfeee5;font-size:14px}
.lok{margin-top:14px;padding:10px 14px;border-radius:12px;font-size:14px;font-weight:600}
.lok-ok{background:var(--ok-bg);color:var(--ok)}.lok-bad{background:var(--bad-bg);color:var(--bad)}.lok-warn{background:var(--warn-bg);color:var(--warn)}.lok-info{background:var(--info-bg);color:var(--info)}
.uji{margin-top:16px;font-size:13px;color:var(--muted)}.uji summary{cursor:pointer;font-weight:600}
.toplist{margin:6px 0 0;padding-left:18px;font-size:13.5px}.toplist li{margin:2px 0}.toplist em{font-style:normal;font-weight:700;color:var(--bad);margin-left:4px}

/* Penilaian */
.grp-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:20px 0 10px}
.grp-head h3{margin:0;font-size:16px}
.pn select{padding:5px 6px;font-size:13.5px;border-radius:8px}
.pn td{vertical-align:top}
.ref{display:block;margin-top:4px}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:12.5px;color:var(--muted);margin:8px 0 0}
.matrix td,.matrix th{text-align:center}.matrix td:first-child,.matrix th:first-child{text-align:left}
.dot{display:inline-block;width:12px;height:12px;border-radius:4px}
.d-done{background:var(--ok)}.d-prog{background:var(--warn)}.d-not{background:var(--line)}

/* Modal & toast */
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-start;justify-content:center;padding:6vh 14px;background:rgba(5,20,13,.55);overflow:auto}
.modal.open{display:flex}
.modal-box{background:var(--card);border-radius:18px;width:min(720px,100%);padding:22px;border:1px solid var(--line)}
.modal-box h2{margin:0 0 4px;font-size:19px}
.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}
.x{border:0;background:transparent;font-size:22px;line-height:1;padding:4px 8px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:16px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--hg-deep);color:#fff;padding:10px 18px;border-radius:12px;font-weight:600;font-size:14px;z-index:60;display:none;max-width:90vw}
.toast.show{display:block}
.toast.err{background:var(--bad)}
.receipt{width:100%;max-width:260px;border-radius:12px;border:1px solid var(--line)}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:14px}.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600}
.split{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:start}
.note{background:var(--info-bg);color:var(--info);border-radius:12px;padding:10px 14px;font-size:13.5px;margin-bottom:14px}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:13.5px}
.big-check{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.clock{font-size:40px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.area-pick{display:flex;flex-wrap:wrap;gap:6px}
.area-pick label{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:999px;font-size:13.5px;background:var(--field);cursor:pointer}
.area-pick input{margin:0}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(290px,86vw);height:auto;z-index:45;transform:translateX(-105%);transition:transform .2s ease;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  body.nav-open .side{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:44}
  .menu-btn{display:inline-flex}
  .top h1{font-size:20px}
  .bar{grid-template-columns:78px 1fr 112px}
  .split{grid-template-columns:1fr}
  .absen{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

body::before{background:var(--hg-deep)}
.pager{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-top:10px}
.brand-logo{height:34px;width:auto;display:block}
[hidden]{display:none!important}
.kpi small a{color:inherit}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side" aria-label="Menu utama">
    <div class="brand"><img class="brand-logo" src="/shared/logo-putih.png" alt="Healthy Go"><div><b>Management Delivery</b><small>Healthy Go</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><div class="me" id="meBox"></div><a href="/delivery/training/">Buka Training (LMS)</a><a href="/?portal=1">Kembali ke portal</a><a href="#" id="logoutLink">Keluar</a></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main><div class="top"><button class="menu-btn" id="menuBtn" aria-label="Buka menu">☰</button><h1 id="pageTitle">Management Delivery</h1></div><div id="view"><div class="card empty">Memuat…</div></div></main>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="modal-box" id="modalBox"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/shared/config.js"></script>
<script src="/shared/auth.js"></script>
<script>
/* Tabel profesional: header beku, scroll, sort lewat panah di kanan judul kolom */
const TBL = {};
function dataTable(id, cols, rows, opt = {}) {
  const st = TBL[id] || (TBL[id] = { key: opt.sortKey || cols[0].key, dir: opt.sortDir || 'asc', page: 0 });
  const col = cols.find(c => c.key === st.key) || cols[0];
  const val = r => col.sort ? col.sort(r) : r[col.key];
  const sorted = [...rows].sort((a, b) => {
    const x = val(a), y = val(b);
    if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
    const c = typeof x === 'string' ? x.localeCompare(y, 'id', { numeric: true }) : x - y;
    return st.dir === 'asc' ? c : -c;
  });
  const size = opt.pageSize || 0, pages = size ? Math.max(1, Math.ceil(sorted.length / size)) : 1;
  if ((st.page || 0) >= pages) st.page = pages - 1; if (!st.page || st.page < 0) st.page = st.page > 0 ? st.page : 0;
  const shown = size ? sorted.slice(st.page * size, st.page * size + size) : sorted;
  const arrow = c => st.key !== c.key ? '<span class="arr idle">▲▼</span>' : `<span class="arr">${st.dir === 'asc' ? '▲' : '▼'}</span>`;
  const pager = size && sorted.length > size ? `<div class="pager" data-pg="${id}"><span class="small muted">${(st.page * size + 1).toLocaleString('id-ID')}–${Math.min(sorted.length, st.page * size + size).toLocaleString('id-ID')} dari ${sorted.length.toLocaleString('id-ID')}</span><span class="row" style="gap:6px"><button class="btn-sm" data-pgo="first" ${st.page ? '' : 'disabled'}>«</button><button class="btn-sm" data-pgo="prev" ${st.page ? '' : 'disabled'}>‹ Sebelumnya</button><span class="small">Hal ${st.page + 1} / ${pages}</span><button class="btn-sm" data-pgo="next" ${st.page < pages - 1 ? '' : 'disabled'}>Berikutnya ›</button><button class="btn-sm" data-pgo="last" ${st.page < pages - 1 ? '' : 'disabled'}>»</button></span></div>` : '';
  st.pages = pages;
  return `<div class="tbl-wrap tbl-scroll" style="max-height:${opt.maxHeight || 520}px"><table class="dt${opt.freezeFirst ? ' freeze' : ''}" data-dt="${id}">
    <thead><tr>${cols.map(c => `<th class="${c.num ? 'num' : ''}" aria-sort="${st.key === c.key ? (st.dir === 'asc' ? 'ascending' : 'descending') : 'none'}"><button type="button" class="th-sort" data-sort="${c.key}" title="Urutkan ${esc(c.label)}"><span>${c.label}</span>${arrow(c)}</button></th>`).join('')}</tr></thead>
    <tbody>${shown.map(r => `<tr ${opt.rowAttr ? opt.rowAttr(r) : ''}>${cols.map(c => `<td class="${c.num ? 'num' : ''}${c.wrap ? ' wrap' : ''}">${c.render ? c.render(r) : esc(r[c.key])}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${cols.length}" class="empty">${opt.empty || 'Tidak ada data.'}</td></tr>`}</tbody>
  </table></div>${pager}`;
}
function bindDataTable(root, id, redraw) {
  root.querySelectorAll(`table[data-dt="${id}"] [data-sort]`).forEach(b => b.onclick = () => {
    const st = TBL[id];
    if (st.key === b.dataset.sort) st.dir = st.dir === 'asc' ? 'desc' : 'asc';
    else { st.key = b.dataset.sort; st.dir = b.closest('th').classList.contains('num') ? 'desc' : 'asc'; }
    st.page = 0; redraw();
  });
  root.querySelectorAll(`[data-pg="${id}"] [data-pgo]`).forEach(b => b.onclick = () => {
    const st = TBL[id], g = b.dataset.pgo;
    st.page = g === 'first' ? 0 : g === 'last' ? st.pages - 1 : g === 'prev' ? Math.max(0, st.page - 1) : Math.min(st.pages - 1, st.page + 1);
    redraw();
  });
}

/* =====================================================================
   MANAGEMENT DELIVERY — tersambung ke Supabase.
   Keamanan data dijaga RLS & fungsi database; menu di sini hanya tampilan.
   ===================================================================== */
const { sb } = HGAuth;
const $ = s => document.querySelector(s);

const DSH = { bulan: [monthKey(TODAY)], batch: [], branch: [], area: [], jabatan: [], nama: [], per: 'branch' };
const DCACHE = { key: '', cost: [], comp: [], target: [] };
const uniq = a => [...new Set(a)];
const num = n => Math.round(n || 0).toLocaleString('id-ID');
const fmtPct = (v, d = 1) => v == null ? '—' : v.toLocaleString('id-ID', { minimumFractionDigits: d, maximumFractionDigits: d }) + '%';
const rupiahShort = n => Math.abs(n) >= 1e9 ? 'Rp ' + (n / 1e9).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + ' M' : Math.abs(n) >= 1e6 ? 'Rp ' + (n / 1e6).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + ' jt' : rupiah(n);
const nb = s => /^\d+$/.test(String(s || '')) ? String(s).padStart(2, '0') : String(s || '');          // batch "4" = "04"
const kunci = (nama, br) => normName(nama) + '|' + normName(br);
// 00:00:00 = tidak ada pengiriman → tidak ikut dirata-rata
const toSec = t => { if (!t) return null; const [h, m, s] = String(t).split(':').map(Number); const v = h * 3600 + m * 60 + (s || 0); return v > 0 ? v : null; };
const fromSec = s => s == null ? '—' : pad(Math.floor(s / 3600)) + ':' + pad(Math.floor(s % 3600 / 60));
async function fetchAll(make) {
  let out = [], from = 0;
  for (;;) { const { data, error } = await make().range(from, from + 999); if (error) throw new Error(error.message); out = out.concat(data); if (data.length < 1000 || from > 300000) break; from += 1000; }
  return out;
}
/** Kunci nama|branch yang punya akun (branch dari area penugasan saat ini). */
function kunciAkun() { const m = new Map(); D.people.forEach(p => { const a = area(areaOf(p.id)); if (a.id) m.set(kunci(p.nama, branch(a.branch_id).nama), p.id); }); return m; }
async function loadDash() {
  const months = [...DSH.bulan].sort(), key = months.join(',');
  if (DCACHE.key === key) return;
  const per = await Promise.all(months.map(m => { const s = m + '-01', e = monthKey(addDays(s, 32)) + '-01'; return Promise.all([
    fetchAll(() => sb.from('dlv_costs').select('*').eq('bulan', s).order('id')),
    fetchAll(() => sb.from('dlv_complaints').select('id,batch,tanggal,sesi,branch,nama_customer,tipe,keterangan,nama_kurir,kode_warna,area_nama,branch_nama').gte('tanggal', s).lt('tanggal', e).order('id'))]); }));
  const akun = kunciAkun();
  const cost = per.flatMap(p => p[0]).map(r => ({ ...r, batch: nb(r.batch), kKey: kunci(r.nama, r.branch), kNama: r.nama, branchNama: (r.branch || '').trim() || 'Tanpa branch', areaRaw: (r.area || '').trim(), jab: (r.jabatan || '').trim() || '—', pid: akun.get(kunci(r.nama, r.branch)) || null }));
  const jabOf = {}; cost.forEach(c => jabOf[c.kKey] = c.jab);
  const comp = per.flatMap(p => p[1]).map(r => ({ ...r, batch: nb(r.batch), kKey: r.nama_kurir ? kunci(r.nama_kurir, r.branch_nama) : 'n:-', kNama: r.nama_kurir || 'Tanpa kurir', branchNama: (r.branch_nama || '').trim() || 'Tanpa branch', areaRaw: (r.area_nama || '').trim(), jab: jabOf[r.nama_kurir ? kunci(r.nama_kurir, r.branch_nama) : ''] || '—' }));
  const all = [...cost, ...comp], cab = {};
  all.forEach(r => { if (r.areaRaw) (cab[normName(r.areaRaw)] = cab[normName(r.areaRaw)] || new Set()).add(r.branchNama); });
  all.forEach(r => r.areaNama = r.areaRaw ? (cab[normName(r.areaRaw)].size > 1 ? r.areaRaw + ' · ' + r.branchNama : r.areaRaw) : (r.kNama === 'Tanpa kurir' ? 'Tanpa kurir' : 'Tanpa area'));
  const dupNama = {}; cost.forEach(c => (dupNama[normName(c.kNama)] = dupNama[normName(c.kNama)] || new Set()).add(c.branchNama));
  all.forEach(r => r.label = r.kNama + (dupNama[normName(r.kNama)] && dupNama[normName(r.kNama)].size > 1 ? ' · ' + r.branchNama : ''));
  Object.assign(DCACHE, { cost, comp, key, target: await q(sb.from('dlv_target_box').select('*').eq('bulan', months[months.length - 1] + '-01')) });
}
const matchOrg = r => (!DSH.branch.length || DSH.branch.includes(r.branchNama)) && (!DSH.area.length || DSH.area.includes(r.areaNama)) && (!DSH.jabatan.length || DSH.jabatan.includes(r.jab)) && (!DSH.nama.length || DSH.nama.includes(r.kKey));
const matchBatch = r => !DSH.batch.length || DSH.batch.includes(r.batch);
const fCost = () => DCACHE.cost.filter(r => matchOrg(r) && matchBatch(r));
const fComp = () => DCACHE.comp.filter(r => matchOrg(r) && matchBatch(r));
function dashOptions(k) {
  const rows = [...DCACHE.cost, ...DCACHE.comp];
  if (k === 'bulan') { const t = new Date(), out = []; for (let i = 0; i < 12; i++) out.push(iso(new Date(t.getFullYear(), t.getMonth() - i, 1)).slice(0, 7)); return out.map(m => [m, monthLabel(m)]); }
  if (k === 'batch') return uniq(rows.map(r => r.batch).filter(Boolean)).sort((a, b) => a.localeCompare(b, 'id', { numeric: true })).map(b => [b, /^\d+$/.test(b) ? 'Batch ' + b : b]);
  if (k === 'branch') return uniq(rows.map(r => r.branchNama)).sort().map(b => [b, b]);
  if (k === 'area') return uniq(rows.filter(r => !DSH.branch.length || DSH.branch.includes(r.branchNama)).map(r => r.areaNama)).sort().map(a => [a, a]);
  if (k === 'jabatan') return uniq(DCACHE.cost.map(r => r.jab)).sort().map(j => [j, j]);
  if (k === 'nama') { const m = new Map(); DCACHE.cost.filter(r => (!DSH.branch.length || DSH.branch.includes(r.branchNama)) && (!DSH.area.length || DSH.area.includes(r.areaNama)) && (!DSH.jabatan.length || DSH.jabatan.includes(r.jab))).forEach(r => m.set(r.kKey, r.label)); return [...m].sort((a, b) => a[1].localeCompare(b[1])); }
  return [];
}
/** Rekap dari baris Cost: semua kolom di-SUM, Max Time dirata-rata. */
function ringkas(cost) {
  const S = k => cost.reduce((a, x) => a + Number(x[k] || 0), 0);
  const box = S('total_box'), hg = S('box_hg'), bk = S('box_bk'), gt = S('box_gt'), late = S('late_delivery'), comp = S('complaint'), tc = S('total_cost');
  const mt = cost.map(x => toSec(x.max_time)).filter(x => x != null);
  const b2b = S('box_b2b'), b2c = S('box_b2c');
  return { box, hg, bk, gt, lain: Math.max(0, box - hg - bk - gt), b2b, b2c, office: Math.max(0, box - b2b - b2c), late, comp, weekly: S('total_weekly'), tcost: tc, maxAvg: mt.length ? mt.reduce((a, x) => a + x, 0) / mt.length : null,
    pLate: box ? late / box * 100 : null, pComp: box ? comp / box * 100 : null, cpb: box ? tc / box : null };
}
const PIE = ['#1d8a5b', '#e0b400', '#2b6fb6', '#c64039', '#7c4dcc', '#e07b2c', '#6b7f74'];
function pieChart(items, label) {
  items = items.filter(x => x.v > 0); const tot = items.reduce((a, x) => a + x.v, 0);
  if (!tot) return '<div class="empty">Tidak ada data.</div>';
  const r = 60, C = 2 * Math.PI * r; let off = 0;
  const segs = items.map((x, i) => { const len = x.v / tot * C, s = `<circle r="${r}" cx="90" cy="90" fill="none" stroke="${PIE[i % PIE.length]}" stroke-width="36" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 90 90)"><title>${esc(x.l)}: ${num(x.v)}</title></circle>`; off += len; return s; }).join('');
  return `<div class="pie"><svg viewBox="0 0 180 180" width="170" height="170" role="img" aria-label="${esc(label)}">${segs}<text x="90" y="88" text-anchor="middle" class="pie-n">${num(tot)}</text><text x="90" y="108" text-anchor="middle" class="pie-l">total</text></svg><ul class="pie-legend">${items.map((x, i) => `<li><span class="sw" style="background:${PIE[i % PIE.length]}"></span><span>${esc(x.l)}</span><b>${num(x.v)}</b><span class="muted">${fmtPct(x.v / tot * 100)}</span></li>`).join('')}</ul></div>`;
}
function barChart(items, fmt, cls) {
  const max = Math.max(0, ...items.map(x => x.v)) || 1;
  return `<div class="bars">${items.map(x => `<div class="bar"><span class="bar-l" title="${esc(x.l)}">${esc(x.l)}</span><div class="bar-track"><div class="bar-fill ${cls || ''}" style="width:${Math.max(x.v / max * 100, x.v ? 1 : 0)}%"></div></div><span class="small"><b>${fmt(x.v)}</b></span></div>`).join('') || '<div class="empty">Tidak ada data.</div>'}</div>`;
}

      pop.querySelectorAll('input[type=checkbox]').forEach(c => c.onchange = () => { DSH[k] = [...pop.querySelectorAll('input[type=checkbox]:checked')].map(x => x.value); onChange(k); });

/** Pindah area: tutup penugasan lama (riwayat tetap ada), buka penugasan baru. */
async function setArea(profileId, areaId) {
  const cur = D.penugasan.find(x => x.profile_id === profileId && !x.selesai);
  if (cur && cur.area_id === areaId) return;
  if (cur) {
    if (cur.mulai >= TODAY) await q(sb.from('dlv_penugasan').delete().eq('id', cur.id));
    else await q(sb.from('dlv_penugasan').update({ selesai: addDays(TODAY, -1) }).eq('id', cur.id));
  }
  if (areaId) await q(sb.from('dlv_penugasan').insert({ profile_id: profileId, area_id: areaId, mulai: TODAY }));
}

function lokasi() {
  const list = titikSaya();
  if (!list.length) return { ok: false, tone: 'bad', msg: 'Belum ada titik absensi untuk staf. Admin perlu menambah titik yang berlaku untuk semua.' };
  if (!AB.pos) return { ok: false, tone: AB.posErr ? 'bad' : 'info', msg: AB.posErr || 'Mencari lokasi Anda…' };
  const { latitude: lat, longitude: lng, accuracy: acc } = AB.pos;
  if (acc > 150) return { ok: false, tone: 'warn', msg: `Akurasi GPS rendah (±${Math.round(acc)} m). Pindah ke tempat terbuka lalu cek ulang.` };
  const n = list.map(t => ({ t, d: haversine(lat, lng, t.lat, t.lng) })).sort((a, b) => a.d - b.d)[0];
  return n.d <= n.t.radius_m ? { ok: true, tone: 'ok', msg: `Dalam radius: ${fmtJarak(n.d)} dari ${n.t.nama}.`, lat, lng, acc } : { ok: false, tone: 'bad', msg: `Di luar radius: ${fmtJarak(n.d)} dari ${n.t.nama}. Maksimal ${n.t.radius_m} m.` };

/* Laporan absensi + unduh Excel. Kurir: per sesi (Lunch/Dinner/Weekend). Staf: absen Masuk per hari kerja. */
const LA = { dari: monthKey(TODAY) + '-01', sampai: TODAY, area: '', jab: '', view: 'rekap' };
const sesiHari = (u, d) => D.sessions.filter(s => s.untuk === u && s.hari.includes(isodow(d))).map(s => s.sesi).filter(s => s !== 'Pulang');
async function hitungAbsen() {
  const ids = myAreaIds(), qq = LA.area;
  const orang = D.people.filter(p => p.aktif && (!LA.jab || p.position_id === LA.jab) && (p.position_id === 'kurir' ? (ids.includes(areaOf(p.id)) && (!qq || areaOf(p.id) === qq)) : (!qq && (R.staf || p.id === ME.id))));
  const pids = orang.map(p => p.id); let abs = [];
  abs = await inChunks(pids, x => sb.from('attendance').select('id,profile_id,tanggal,sesi,status,jam,point_id,jarak_m,catatan,sumber').in('profile_id', x).gte('tanggal', LA.dari).lte('tanggal', LA.sampai).order('id'));
  const idx = {}; abs.forEach(a => idx[a.profile_id + '|' + a.tanggal + '|' + a.sesi] = a);
  const detail = [];
  orang.forEach(p => {
    const mulai = (D.penugasan.filter(x => x.profile_id === p.id).map(x => x.mulai).sort()[0]) || LA.dari;
    for (let d = LA.dari; d <= LA.sampai && d <= TODAY; d = addDays(d, 1)) {
      if (p.position_id === 'kurir' && d < mulai) continue;          // sebelum ditugaskan tidak dihitung
      sesiHari(p.position_id === 'kurir' ? 'kurir' : 'staf', d).forEach(s => {
        const a = idx[p.id + '|' + d + '|' + s];

/* ---------- Bantu: query dalam potongan kecil (hindari URL terlalu panjang → "Failed to fetch") ---------- */
async function inChunks(ids, make, size = 60) {
  let out = [];
  for (let i = 0; i < ids.length; i += size) out = out.concat(await fetchAll(() => make(ids.slice(i, i + size))));
  return out;
}
const keyOf = s => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
function parseCSV(text) {
  text = text.replace(/^\uFEFF/, '');
  const first = text.split(/\r?\n/)[0] || '', cnt = c => (first.match(new RegExp('\\' + c, 'g')) || []).length;
  const d = cnt('\t') > cnt(',') && cnt('\t') > cnt(';') ? '\t' : cnt(';') > cnt(',') ? ';' : ',';
  const rows = []; let row = [], f = '', qt = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (qt) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else qt = false; } else f += ch; }
    else if (ch === '"') qt = true; else if (ch === d) { row.push(f); f = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += ch;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}

async function imporTarget(file, bulanDefault) {
  const raw = parseCSV(await file.text()); if (raw.length < 2) throw new Error('File kosong.');
  const head = raw[0].map(keyOf), col = al => head.findIndex(h => al.includes(h));
  const iN = col(['nama', 'name']), iB = col(['branch', 'cabang']), iM = col(['bulan', 'month']), iT = col(['target', 'targetbox']);
  if (iN < 0 || iT < 0) throw new Error('Kolom "nama" dan "target" wajib ada. Kolom opsional: branch, bulan (2610 atau 2026-10).');
  const akun = {}; kurirList({ semua: true }).forEach(k => { const a = area(areaOf(k.id)); (akun[normName(k.nama)] = akun[normName(k.nama)] || []).push({ id: k.id, br: normName(branch(a.branch_id).nama || '') }); });
  const bln = v => { const s = String(v || '').trim(); let m = s.match(/^(\d{2})(\d{2})$/); if (m) return `20${m[1]}-${m[2]}-01`; m = s.match(/^(\d{4})-(\d{1,2})/); if (m) return `${m[1]}-${m[2].padStart(2, '0')}-01`; return null; };
  const ok = new Map(), gagal = [];
  raw.slice(1).forEach((r, i) => {
    const nama = String(r[iN] || '').trim(), br = iB >= 0 ? normName(r[iB]) : '', t = Number(String(r[iT] || '').replace(/[^0-9]/g, '')), b = iM >= 0 && String(r[iM] || '').trim() ? bln(r[iM]) : bulanDefault + '-01';
    const c = (akun[normName(nama)] || []).filter(x => !br || x.br === br);
    if (!nama || !String(r[iT] || '').trim()) return gagal.push([i + 2, nama, 'nama/target kosong']);
    if (!b) return gagal.push([i + 2, nama, 'format bulan salah']);
    if (!c.length) return gagal.push([i + 2, nama, br ? 'tidak ada akun kurir dengan nama + branch ini' : 'tidak ada akun kurir dengan nama ini']);
    if (c.length > 1) return gagal.push([i + 2, nama, 'nama ada di beberapa branch, isi kolom branch']);
    ok.set(c[0].id + '|' + b, { profile_id: c[0].id, bulan: b, target: t });
  });
  const rows = [...ok.values()];
  for (let i = 0; i < rows.length; i += 500) await q(sb.from('dlv_target_box').upsert(rows.slice(i, i + 500)));
  return { masuk: rows.length, gagal };
}

  </tbody></table></div></div>`;
  const form = id => {
    const t = id ? D.points.find(x => x.id === id) : { nama: '', area_id: null, division_id: 'DLV', lat: '', lng: '', radius_m: 100, aktif: true };
    const scope = t.area_id ? t.area_id : t.division_id ? 'DLV' : 'ALL';
    openModal(`${modalHead(id ? 'Ubah titik' : 'Tambah titik', 'Koordinat bisa diambil dari Google Maps (klik kanan pada lokasi) atau dengan berdiri di lokasi lalu pakai lokasi saat ini.')}
    <div class="form-grid"><label class="f"><span>Nama titik</span><input id="tkNama" value="${esc(t.nama)}" placeholder="contoh: Hub PIK 1"></label>
      <label class="f"><span>Berlaku untuk</span><select id="tkScope">${opt('DLV', 'Semua Delivery (kurir & staf)', scope)}${opt('ALL', 'All divisi', scope)}${D.areas.map(a => opt(a.id, 'Kurir area ' + a.nama + ' (' + (branch(a.branch_id).nama || '') + ')', scope)).join('')}</select></label>
      <label class="f"><span>Latitude</span><input id="tkLat" inputmode="decimal" value="${t.lat}"></label><label class="f"><span>Longitude</span><input id="tkLng" inputmode="decimal" value="${t.lng}"></label>
      <label class="f"><span>Radius (meter)</span><input id="tkRad" type="number" min="20" max="1000" step="10" value="${t.radius_m}"></label>
      <label class="f"><span>Status</span><select id="tkAkt">${opt('1', 'Aktif', t.aktif ? '1' : '0')}${opt('0', 'Nonaktif', t.aktif ? '1' : '0')}</select></label></div>
    <div class="actions" style="justify-content:space-between"><span><button class="btn-sm" id="tkHere">Pakai lokasi saya saat ini</button>${id ? ' <button class="btn-sm btn-danger" id="tkDel">Hapus titik</button>' : ''}</span><span><button data-close>Batal</button> <button class="btn-primary" id="tkSave">Simpan</button></span></div>`);
    if (id) $('#tkDel').onclick = () => { if (!confirm('Hapus titik ' + t.nama + '?')) return; run($('#tkDel'), async () => { const { error } = await sb.from('attendance_points').delete().eq('id', id); if (error) throw new Error(/foreign key|violates/i.test(error.message) ? 'Titik ini sudah dipakai untuk absen, jadi tidak bisa dihapus (supaya riwayat absen tetap lengkap). Ubah statusnya menjadi Nonaktif.' : error.message); await loadAll(); closeModal(); toast('Titik dihapus.'); setTitik(); }); };
    $('#tkHere').onclick = () => navigator.geolocation.getCurrentPosition(p => { $('#tkLat').value = p.coords.latitude.toFixed(6); $('#tkLng').value = p.coords.longitude.toFixed(6); toast('Lokasi terisi (±' + Math.round(p.coords.accuracy) + ' m).'); }, () => toast('Lokasi tidak terbaca.', true), { enableHighAccuracy: true, timeout: 15000 });
    $('#tkSave').onclick = () => run($('#tkSave'), async () => {
      const sc = $('#tkScope').value, lat = Number($('#tkLat').value.replace(',', '.')), lng = Number($('#tkLng').value.replace(',', '.'));
      if (!$('#tkNama').value.trim()) throw new Error('Isi nama titik.');
      if (!$('#tkLat').value || !$('#tkLng').value || !(lat >= -90 && lat <= 90) || !(lng >= -180 && lng <= 180)) throw new Error('Koordinat tidak valid. Contoh: -6.10920 dan 106.74130.');
      const row = { nama: $('#tkNama').value.trim(), area_id: sc === 'DLV' || sc === 'ALL' ? null : sc, division_id: sc === 'ALL' ? null : 'DLV', lat, lng, radius_m: Number($('#tkRad').value), aktif: $('#tkAkt').value === '1' };
      const { error } = id ? await sb.from('attendance_points').update(row).eq('id', id) : await sb.from('attendance_points').insert(row);
      if (error) throw new Error(/duplicate/.test(error.message) ? 'Nama titik sudah dipakai.' : /radius/.test(error.message) ? 'Radius harus 20–1000 meter.' : error.message);
      await loadAll(); closeModal(); toast('Titik disimpan.'); setTitik();
    });
  };
  $('#tkAdd').onclick = () => form(null); $('#sOut').querySelectorAll('[data-tk]').forEach(b => b.onclick = () => form(b.dataset.tk));
}
const TS = { bulan: monthKey(TODAY) };
async function setTarget() {
  const m0 = TS.bulan + '-01', months = [monthKey(addDays(monthKey(TODAY) + '-01', -1)), monthKey(TODAY), monthKey(addDays(monthKey(TODAY) + '-01', 32))];
  const over = await fetchAll(() => sb.from('dlv_target_box').select('*').eq('bulan', m0).order('profile_id')), def = k => (D.targetDefault.find(x => x.kontrak === k) || {}).target || 0;
  const ks = kurirList().sort((a, b) => a.nama.localeCompare(b.nama));
  $('#sOut').innerHTML = `<div class="card"><h2>Target box bulanan</h2><p class="sub">Default berlaku untuk semua kurir sesuai kontrak. Isi target khusus hanya untuk yang berbeda.</p>
  <div class="row" style="margin-bottom:12px"><label class="f grow"><span>Import target dari CSV (kolom: nama, target; opsional: branch, bulan)</span><input type="file" id="tCsv" accept=".csv,text/csv,text/plain"></label><button class="btn-soft" id="tTpl">Unduh contoh CSV</button></div>
  <div class="row"><label class="f"><span>Bulan</span><select id="tBulan">${months.map(m => opt(m, monthLabel(m), TS.bulan)).join('')}</select></label>
  ${['Full Time', 'Part Time'].map(k => `<label class="f"><span>Default ${k}</span><input type="number" min="0" step="10" data-def="${k}" value="${def(k)}" style="width:130px"></label>`).join('')}</div>
  <div class="tbl-wrap" style="max-height:460px;overflow:auto;margin-top:14px"><table><thead><tr><th>Kurir</th><th>Area</th><th>Kontrak</th><th class="num">Default</th><th>Target khusus ${monthLabel(TS.bulan)}</th></tr></thead><tbody>
  ${ks.map(k => { const o = over.find(x => x.profile_id === k.id); return `<tr><td><b>${esc(k.nama)}</b></td><td>${esc(area(areaOf(k.id)).nama || '—')}</td><td>${esc(k.kontrak || '—')}</td><td class="num">${def(k.kontrak)}</td><td><input type="number" min="0" step="10" data-t="${k.id}" value="${o ? o.target : ''}" placeholder="pakai default" style="width:140px"></td></tr>`; }).join('') || '<tr><td colspan="5" class="empty">Belum ada kurir.</td></tr>'}
  </tbody></table></div><div class="actions"><button class="btn-primary" id="tSave">Simpan target</button></div></div>`;
  $('#tBulan').onchange = e => { TS.bulan = e.target.value; setTarget(); };
  $('#tTpl').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['nama,branch,bulan,target\nAde Ferdiansyah,CK Kapuk,' + TS.bulan.slice(2, 4) + TS.bulan.slice(5, 7) + ',650\n'], { type: 'text/csv' })); a.download = 'contoh-target.csv'; a.click(); };
  $('#tCsv').onchange = e => { const f = e.target.files[0]; if (!f) return; run(null, async () => {
    const r = await imporTarget(f, TS.bulan); await setTarget();
    if (r.gagal.length) openModal(`${modalHead('Import target', r.masuk + ' target masuk, ' + r.gagal.length + ' baris tidak masuk')}<div class="tbl-wrap" style="max-height:360px"><table><thead><tr><th>Baris</th><th>Nama</th><th>Alasan</th></tr></thead><tbody>${r.gagal.map(g => `<tr><td>${g[0]}</td><td>${esc(g[1])}</td><td>${esc(g[2])}</td></tr>`).join('')}</tbody></table></div><div class="actions"><button class="btn-primary" data-close>Tutup</button></div>`);
    else toast(r.masuk + ' target berhasil diimpor.'); }); };
  $('#tSave').onclick = () => run($('#tSave'), async () => {
    await q(sb.from('dlv_target_default').upsert([...$('#sOut').querySelectorAll('[data-def]')].map(i => ({ kontrak: i.dataset.def, target: Math.max(0, Number(i.value) || 0) }))));
    const ins = [], del = [];
    $('#sOut').querySelectorAll('[data-t]').forEach(i => { const v = Number(i.value); if (i.value !== '' && v >= 0) ins.push({ profile_id: i.dataset.t, bulan: m0, target: v }); else if (over.some(o => o.profile_id === i.dataset.t)) del.push(i.dataset.t); });
    if (ins.length) await q(sb.from('dlv_target_box').upsert(ins));
    if (del.length) await q(sb.from('dlv_target_box').delete().eq('bulan', m0).in('profile_id', del));
    await loadAll(); toast('Target ' + monthLabel(TS.bulan) + ' tersimpan.');
  });
}

/* ---------- Sinkronisasi spreadsheet ---------- */
async function fnCall(name, body) {
  const { data, error } = await sb.functions.invoke(name, { body });
  if (error) { let m = error.message; try { const j = await error.context.json(); if (j && j.error) m = j.error; } catch (_) { } throw new Error(m); }
  if (data && data.error) throw new Error(data.error);
  return data;
}
async function setSync() {
  clearInterval(setSync.t);
  const out = $('#sOut'); if (!out) return;
  const logs = await q(sb.from('sync_log').select('*').order('mulai', { ascending: false }).limit(30));
  const latest = {}; logs.forEach(l => { if (!latest[l.sumber] && l.status !== 'berjalan') latest[l.sumber] = l; });
  const ids = Object.values(latest).map(l => l.id);
  const um = ids.length ? await q(sb.from('sync_unmatched').select('*').in('sync_id', ids)) : [];
  const jalan = logs.some(l => l.status === 'berjalan');
  const chip = s => s === 'sukses' ? 'c-ok' : s === 'gagal' ? 'c-bad' : 'c-warn';
  out.innerHTML = `<div class="card"><div class="row" style="justify-content:space-between"><div><h2>Sinkronisasi spreadsheet</h2><p class="sub" style="margin:0">Cost dan complaint disalin otomatis setiap hari sekitar pukul 01.00 (cost 3 bulan terakhir, complaint 60 hari terakhir). Gunakan tombol ini kalau perlu data terbaru sebelum jadwal.</p></div>
    <div class="row"><button class="btn-soft" id="syPenuh" ${jalan ? 'disabled' : ''}>Sinkronkan penuh</button><button class="btn-primary" id="syBtn" ${jalan ? 'disabled' : ''}>${jalan ? 'Sedang berjalan…' : 'Sinkronkan sekarang'}</button></div></div>
    <div class="kpis">${['Cost', 'Complaint'].map(s => { const l = latest[s]; return `<div class="kpi"><span>${s}</span><b style="font-size:20px">${l ? `<span class="chip ${chip(l.status)}">${l.status}</span>` : '—'}</b><small>${l ? fmtDT(l.mulai) + ' · ' + (l.baris_masuk || 0).toLocaleString('id-ID') + ' baris' : 'Belum pernah'}</small></div>`; }).join('')}</div></div>
  <div class="card"><h2>Nama yang tidak cocok</h2><p class="sub">Baris ini tetap tersimpan, tetapi tidak masuk ke performa kurir karena namanya tidak sama dengan data kurir. Samakan ejaan di spreadsheet atau di Akun kurir, lalu sinkronkan ulang.</p>
  ${um.length ? `<div class="tbl-wrap"><table><thead><tr><th>Sumber</th><th>Nama di spreadsheet</th></tr></thead><tbody>${um.sort((a, b) => a.nama.localeCompare(b.nama)).map(u => `<tr><td>${esc(u.sumber)}</td><td><span class="chip c-warn">${esc(u.nama)}</span></td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">Semua nama cocok.</p>'}</div>
  <div class="card"><h2>Riwayat</h2><div class="tbl-wrap" style="margin-top:10px"><table><thead><tr><th>Mulai</th><th>Sumber</th><th>Mode</th><th>Status</th><th class="num">Masuk</th><th class="num">Dilewati</th><th>Keterangan</th></tr></thead><tbody>
  ${logs.map(l => `<tr><td>${fmtDT(l.mulai)}</td><td>${esc(l.sumber)}</td><td class="small">${esc(l.mode || '—')}</td><td><span class="chip ${chip(l.status)}">${l.status}</span></td><td class="num">${(l.baris_masuk || 0).toLocaleString('id-ID')}</td><td class="num">${l.baris_gagal || 0}</td><td class="small wrap">${esc(l.pesan || '')}</td></tr>`).join('') || '<tr><td colspan="7" class="empty">Belum ada sinkronisasi.</td></tr>'}
  </tbody></table></div></div>`;
  const go = (btn, mode) => run(btn, async () => {
    if (mode === 'penuh' && !confirm('Sinkronkan SEMUA baris spreadsheet? Bisa memakan waktu beberapa menit.')) return;
    const r = await fnCall('sync-sheet', { action: 'picu', mode }); toast(r.pesan);
    let n = 0; setSync.t = setInterval(() => { if (STab !== 'sync' || !$('#syBtn') || ++n > 24) return clearInterval(setSync.t); setSync().catch(() => { }); }, 10000);
  });
  $('#syBtn').onclick = () => go($('#syBtn'), 'normal'); $('#syPenuh').onclick = () => go($('#syPenuh'), 'penuh');
  if (jalan) { setSync.t = setInterval(() => { if (STab !== 'sync' || !$('#syBtn')) return clearInterval(setSync.t); setSync().catch(() => { }); }, 10000); }
}

/* ---------- Router ---------- */
const PAGES = { tanya: pageTanya, dashboard: pageDashboard, performa: pagePerforma, penilaian: pagePenilaian, laporan: pageLaporan, absensi: pageAbsensi, reimburse: pageReimburse, akun: pageAkun, pengaturan: pagePengaturan };
function render() {
  stopCam(); clearInterval(absenSaya.t); clearInterval(setSync.t);
  const allowed = NAV.filter(n => n.id && n.ok());
  let id = location.hash.slice(1); if (!allowed.some(n => n.id === id)) id = 'dashboard';
  const has = i => { for (let j = i + 1; j < NAV.length && !NAV[j].grp; j++) if (NAV[j].ok()) return true; return false; };
  $('#nav').innerHTML = NAV.map((n, i) => n.grp ? (has(i) ? `<div class="grp">${n.grp}</div>` : '') : n.ok() ? `<a href="#${n.id}" class="${n.id === id ? 'active' : ''}">${n.label}</a>` : '').join('');
  const lbl = NAV.find(n => n.id === id).label; $('#pageTitle').textContent = lbl; document.title = lbl + ' · Management Delivery';
  Promise.resolve(PAGES[id]($('#view'))).catch(e => $('#view').innerHTML = `<div class="card empty">Gagal memuat: ${esc(e.message)}</div>`);
}
window.addEventListener('hashchange', () => { document.body.classList.remove('nav-open'); render(); window.scrollTo(0, 0); });
$('#menuBtn').onclick = () => document.body.classList.add('nav-open');
$('#scrim').onclick = () => document.body.classList.remove('nav-open');
$('#logoutLink').onclick = e => { e.preventDefault(); HGAuth.logout(); };

window.addEventListener('error', e => { const v = $('#view'); if (v && /Memuat/.test(v.textContent)) v.innerHTML = `<div class="card empty">Terjadi kesalahan: ${esc(e.message)}</div>`; });
(async () => {
  const me = await HGAuth.guard('dlv-mgmt');
  ME = me.profile;
  let pusat = false;
  try { pusat = !!(await q(sb.rpc('admin_pusat'))); } catch (e) { $('#view').innerHTML = `<div class="card empty">Gagal memeriksa hak akses: ${esc(e.message)}</div>`; return; }
  const dlv = ME.division_id === 'DLV', pj = ME.position_id;
  R = { pusat, admin: pusat || (dlv && pj === 'admin'), manajer: pusat || (dlv && pj === 'manajer'), hrd: dlv && pj === 'hrd', korlap: dlv && pj === 'korlap' };
  R.staf = R.admin || R.manajer || R.hrd;
  $('#meBox').innerHTML = `<b>${esc(ME.nama)}</b>${esc(ME.positions ? ME.positions.nama : pj)}`;
  try { await loadAll(); } catch (e) { $('#view').innerHTML = `<div class="card empty">Gagal memuat data: ${esc(e.message)}</div>`; return; }
  render();
})().catch(e => { $('#view').innerHTML = `<div class="card empty">Gagal memulai aplikasi: ${esc(e.message)}</div>`; });
</script>
