<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04331f">
<title>Kurir · Healthy Go</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--hg:#074b34;--hg-deep:#04331f;--hg-700:#0b5e41;--hg-500:#1d8a5b;--hg-100:#e3f1e8;--hg-50:#f1f7f3;--sun:#f3cf1b;
--bg:#f4f6f1;--card:#fff;--ink:#13241c;--muted:#5d6e65;--line:#dde6df;--field:#fff;
--ok:#167a43;--ok-bg:#e2f4e8;--warn:#9a5b00;--warn-bg:#fff2d3;--bad:#b4281c;--bad-bg:#fde7e4;--info:#1f5f99;--info-bg:#e6f0fb;
--nav-h:64px;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a15;--card:#16241d;--ink:#e6efe9;--muted:#9db0a5;--line:#2a3c33;--field:#1b2c24;--hg-100:#1d3a2c;--hg-50:#18291f;--ok:#5fd08f;--ok-bg:#183a27;--warn:#f0b54a;--warn-bg:#3a2d12;--bad:#f2877b;--bad-bg:#3e1d19;--info:#8bbcf0;--info-bg:#18293d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a15;--card:#16241d;--ink:#e6efe9;--muted:#9db0a5;--line:#2a3c33;--field:#1b2c24;--hg-100:#1d3a2c;--hg-50:#18291f;--ok:#5fd08f;--ok-bg:#183a27;--warn:#f0b54a;--warn-bg:#3a2d12;--bad:#f2877b;--bad-bg:#3e1d19;--info:#8bbcf0;--info-bg:#18293d;color-scheme:dark}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--hg-deep)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
button:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--hg);border-color:var(--hg);color:#fff}
.btn-block{width:100%;padding:14px;font-size:16px;border-radius:14px}
.btn-danger{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:9px}
input,select,textarea{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;font-size:16px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
label.f>*{color:var(--ink);font-weight:500}

.proto{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:center;padding:6px 12px;background:var(--sun);color:#3b3000;font-size:12.5px;font-weight:600}
.proto select{width:auto;padding:3px 8px;font-size:13px;border-radius:8px;border:1px solid #c9a900;background:#fff8d6;color:#3b3000}
.top{position:sticky;top:0;z-index:20;background:var(--hg-deep);color:#fff;padding:12px 16px}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.avatar{width:40px;height:40px;border-radius:12px;background:var(--sun);color:var(--hg-deep);display:grid;place-items:center;font-weight:800;flex:none}
.top b{display:block;font-size:15px}.top small{color:#a9c9b6;font-size:12.5px}
.top .out{margin-left:auto;background:transparent;border-color:rgba(255,255,255,.25);color:#fff;padding:7px 12px;font-size:13px}
main{max-width:560px;margin:0 auto;padding:16px 14px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}
h1{font-size:22px;margin:4px 0 14px;letter-spacing:-.01em}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.muted{color:var(--muted)}.small{font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.c-ok{background:var(--ok-bg);color:var(--ok)}.c-warn{background:var(--warn-bg);color:var(--warn)}.c-bad{background:var(--bad-bg);color:var(--bad)}.c-info{background:var(--info-bg);color:var(--info)}.c-mute{background:var(--hg-50);color:var(--muted);border:1px solid var(--line)}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:14px}

/* Bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
.bnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:600}
.bnav a svg{width:22px;height:22px}
.bnav a.active{color:var(--hg-500)}
.bnav a.active svg{stroke-width:2.4}
.ico{position:relative;display:inline-flex}.dot{position:absolute;top:-2px;right:-4px;width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid var(--card)}
.card.alert{border-color:var(--bad);box-shadow:inset 4px 0 0 var(--bad)}
.photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.photos figure{margin:0}.photos img{width:100%;border-radius:12px;border:1px solid var(--line);display:block}.photos figcaption{font-size:12px;color:var(--muted);margin-top:4px;text-align:center}

/* Absen */
.clock-row{display:flex;justify-content:space-between;align-items:flex-end}
.clock{font-size:38px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.sesi{display:grid;gap:8px;margin-top:14px}
.sesi-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--field)}
.sesi-item.on{border-color:var(--hg-500);box-shadow:inset 3px 0 0 var(--hg-500)}
.sesi-item b{display:block}.sesi-item small{color:var(--muted)}
.cam-box{position:relative;height:min(42vh,400px);margin:12px auto 0;background:#0b1712;border-radius:16px;overflow:hidden}
.cam-box video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam-msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:#dfeee5;font-size:14px}
.cam-frame{position:absolute;inset:10% 28% 16%;border:2px dashed rgba(255,255,255,.55);border-radius:50% 50% 46% 46%;pointer-events:none}
.lok{margin-top:12px;padding:10px 12px;border-radius:12px;font-size:14px;font-weight:600}
.lok-ok{background:var(--ok-bg);color:var(--ok)}.lok-bad{background:var(--bad-bg);color:var(--bad)}.lok-warn{background:var(--warn-bg);color:var(--warn)}.lok-info{background:var(--info-bg);color:var(--info)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.uji{margin-top:14px;font-size:13px;color:var(--muted)}.uji summary{cursor:pointer;font-weight:600}
.uji label{display:flex;gap:8px;align-items:center;margin-top:8px}.uji input[type=checkbox]{width:auto}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li b{display:block;font-size:14.5px}.li small{color:var(--muted);font-size:12.5px}
.li.click{cursor:pointer}
.li .r{text-align:right;flex:none}

/* Performa */
.tabs{display:flex;gap:4px;padding:4px;background:var(--hg-50);border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:9px;color:var(--muted);font-size:13.5px}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.target{display:flex;gap:16px;align-items:center}
.ring{flex:none}
.ring .bg{stroke:var(--hg-50)}.ring .fg{stroke:var(--hg-500);transition:stroke-dashoffset .6s ease}
.ring text{fill:var(--ink);font-weight:800;font-size:20px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat span{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.stat b{display:block;font-size:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:12px}
.stat.lead{background:var(--hg);border-color:var(--hg);color:#fff}.stat.lead span,.stat.lead small{color:#bfe0cc}
.split-bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--hg-50);margin:8px 0 4px}
.split-bar i{display:block;height:100%}

/* Modal (sheet) & toast */
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(5,20,13,.55)}
.modal.open{display:flex}
.sheet{background:var(--card);width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.sheet-head h2{margin:0;font-size:18px}
.x{border:0;background:transparent;font-size:24px;line-height:1;padding:2px 8px}
.form{display:grid;gap:12px}
.photo-pick{border:2px dashed var(--line);border-radius:14px;padding:14px;text-align:center;background:var(--field)}
.photo-pick img{max-width:100%;max-height:200px;border-radius:10px;display:block;margin:0 auto 10px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:14px}.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13.5px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--hg-deep);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:60;display:none;max-width:90vw;text-align:center}
.toast.show{display:block}.toast.err{background:var(--bad)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="top"><div class="top-in"><div class="avatar" id="av"></div><div><b id="meName"></b><small id="meSub"></small></div><button class="out" id="outBtn">Akun</button></div></header>
<main id="view"><div class="card empty">Memuat…</div></main>
<nav class="bnav" aria-label="Menu utama"><div class="bnav-in" id="bnav"></div></nav>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/shared/config.js"></script>
<script src="/shared/auth.js"></script>
<script>
/* =====================================================================
   APLIKASI KURIR — tersambung ke Supabase. Hanya data milik kurir sendiri (RLS).
   ===================================================================== */
const { sb } = HGAuth;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const isodow = s => ((parse(s).getDay() + 6) % 7) + 1;
const BULAN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const HARI = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
const fmtDate = s => { const d = parse(s.slice(0, 10)); return d.getDate() + ' ' + BULAN[d.getMonth()] + ' ' + d.getFullYear(); };
const fmtShort = s => { const d = parse(s); return HARI[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth() + 1); };
const fmtDT = s => { const d = new Date(s); return d.getDate() + ' ' + BULAN[d.getMonth()] + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const monthKey = s => s.slice(0, 7), monthLabel = m => BULAN[Number(m.slice(5, 7)) - 1] + '-' + m.slice(2, 4);
const rupiah = n => 'Rp ' + Math.round(n || 0).toLocaleString('id-ID');
const rupiahShort = n => n >= 1e6 ? 'Rp ' + (n / 1e6).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + ' jt' : rupiah(n);
const num = n => Math.round(n || 0).toLocaleString('id-ID');
const fmtPct = (v, d = 1) => v == null ? '—' : v.toLocaleString('id-ID', { minimumFractionDigits: d, maximumFractionDigits: d }) + '%';
const TODAY = iso(new Date());
const nowHM = () => { const n = new Date(); return pad(n.getHours()) + ':' + pad(n.getMinutes()); };

let ME = null;
const D = { sessions: [], points: [], areaId: null, areas: [], branches: [] };
const areaNama = () => (D.areas.find(a => a.id === D.areaId) || {}).nama;
const branchNama = () => { const a = D.areas.find(x => x.id === D.areaId); return a ? (D.branches.find(b => b.id === a.branch_id) || {}).nama : ''; };
const sesiOf = d => D.sessions.filter(s => s.untuk === 'kurir' && s.hari.includes(isodow(d))).sort((a, b) => a.jam_mulai.localeCompare(b.jam_mulai));
const titikSaya = () => D.points.filter(t => t.aktif && ((!t.area_id && (!t.division_id || t.division_id === ME.division_id)) || (t.area_id && t.area_id === D.areaId)));

async function q(p) { const { data, error } = await p; if (error) throw new Error(error.message); return data; }
async function loadBase() {
  const [s, pt, pg, a, b] = await Promise.all([
    q(sb.from('attendance_sessions').select('*')), q(sb.from('attendance_points').select('*')),
    q(sb.from('dlv_penugasan').select('area_id').eq('profile_id', ME.id).is('selesai', null)),
    q(sb.from('dlv_areas').select('id, nama, branch_id')), q(sb.from('dlv_branches').select('id, nama'))
  ]);
  Object.assign(D, { sessions: s, points: pt, areaId: pg[0] ? pg[0].area_id : null, areas: a, branches: b });
}
async function signedUrl(bucket, path) { if (!path) return null; const { data } = await sb.storage.from(bucket).createSignedUrl(path, 600); return data ? data.signedUrl : null; }

/* ---------- UI umum ---------- */
function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : ''); clearTimeout(toast.t); toast.t = setTimeout(() => t.className = 'toast', err ? 6000 : 3400); }
async function run(btn, fn) { const l = btn ? btn.textContent : ''; if (btn) { btn.disabled = true; btn.textContent = 'Memproses…'; } try { return await fn(); } catch (e) { toast(e.message, true); } finally { if (btn) { btn.disabled = false; btn.textContent = l; } } }
function openSheet(title, html) { $('#sheet').innerHTML = `<div class="sheet-head"><h2>${title}</h2><button class="x" data-close aria-label="Tutup">×</button></div>${html}`; $('#modal').classList.add('open'); }
function closeSheet() { $('#modal').classList.remove('open'); }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal' || e.target.closest('[data-close]')) closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
const statusChip = s => ({ Hadir: 'c-ok', Approved: 'c-ok', Waiting: 'c-warn', Rejected: 'c-bad', Izin: 'c-info', Sakit: 'c-info' }[s] || 'c-mute');
const ICON = {
  absen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  reimburse: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>',
  performa: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  training: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8l10-5 10 5-10 5z"/><path d="M6 10v5c3 2 9 2 12 0v-5"/></svg>'
};
const TABS = [['absen', 'Absen'], ['reimburse', 'Reimburse'], ['performa', 'Performa']];

/* ---------- Absen ---------- */
let CAM = null;
const AB = { pos: null, posErr: '', camErr: '', camReady: false, hariIni: [] };
function stopCam() { if (CAM) { CAM.getTracks().forEach(t => t.stop()); CAM = null; } AB.camReady = false; }
function haversine(a, b, c, d) { const R0 = 6371000, t = x => x * Math.PI / 180, dl = t(c - a), dn = t(d - b); const h = Math.sin(dl / 2) ** 2 + Math.cos(t(a)) * Math.cos(t(c)) * Math.sin(dn / 2) ** 2; return 2 * R0 * Math.asin(Math.min(1, Math.sqrt(h))); }
const fmtJarak = m => m >= 1000 ? (m / 1000).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + ' km' : Math.round(m) + ' m';
function lokasi() {
  const list = titikSaya();
  if (!list.length) return { ok: false, tone: 'bad', msg: 'Belum ada titik absensi untuk area Anda. Hubungi admin.' };
  if (!AB.pos) return { ok: false, tone: AB.posErr ? 'bad' : 'info', msg: AB.posErr || 'Mencari lokasi Anda…' };
  const { latitude: lat, longitude: lng, accuracy: acc } = AB.pos;
  if (acc > 150) return { ok: false, tone: 'warn', msg: `Akurasi GPS rendah (±${Math.round(acc)} m). Pindah ke tempat terbuka, lalu cek ulang.` };
  const n = list.map(t => ({ t, d: haversine(lat, lng, t.lat, t.lng) })).sort((a, b) => a.d - b.d)[0];
  return n.d <= n.t.radius_m ? { ok: true, tone: 'ok', msg: `Lokasi sesuai: ${fmtJarak(n.d)} dari ${n.t.nama}.`, lat, lng, acc } : { ok: false, tone: 'bad', msg: `Terlalu jauh: ${fmtJarak(n.d)} dari ${n.t.nama}. Mendekatlah hingga ${n.t.radius_m} m.` };
}
function cekLokasi() {
  AB.pos = null; AB.posErr = ''; updAbsen();
  if (!navigator.geolocation) { AB.posErr = 'HP ini tidak mendukung lokasi.'; return updAbsen(); }
  navigator.geolocation.getCurrentPosition(p => { AB.pos = p.coords; updAbsen(); }, e => { AB.posErr = e.code === 1 ? 'Izin lokasi ditolak. Izinkan lokasi untuk situs ini, lalu cek ulang.' : 'Lokasi belum ketemu. Pastikan GPS menyala, lalu cek ulang.'; updAbsen(); }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
}
async function startCam() {
  AB.camErr = ''; AB.camReady = false; updAbsen();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { AB.camErr = 'HP ini tidak mendukung kamera langsung. Pakai Chrome atau Safari terbaru.'; return updAbsen(); }
  try { stopCam(); CAM = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 720 }, height: { ideal: 960 } }, audio: false }); const v = $('#cam'); if (!v) return stopCam(); v.srcObject = CAM; await v.play(); AB.camReady = true; }
  catch (e) { AB.camErr = e.name === 'NotAllowedError' ? 'Izin kamera ditolak. Izinkan kamera untuk situs ini, lalu ketuk Nyalakan kamera.' : 'Kamera tidak bisa dibuka (' + e.name + ').'; }
  updAbsen();
}
function snapBlob(sesi) {
  return new Promise(res => {
    const v = $('#cam'), vw = v.videoWidth || 720, vh = v.videoHeight || 960, w = Math.min(720, vw), h = Math.round(vh * w / vw);
    const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.drawImage(v, 0, 0, w, h);
    x.fillStyle = 'rgba(0,0,0,.6)'; x.fillRect(0, h - 52, w, 52); x.fillStyle = '#fff'; x.font = '600 15px sans-serif';
    x.fillText(`${ME.nama} · ${sesi}`, 10, h - 30); x.fillText(`${fmtDate(TODAY)} ${nowHM()}`, 10, h - 10);
    c.toBlob(res, 'image/jpeg', .7);
  });
}

  const out = $('#pfOut');
  if (PF.tab === 'pendapatan') out.innerHTML = `<h2>Pendapatan mingguan</h2><div class="list">${costs.map(c => `<div class="li click" data-c="${c.id}" tabindex="0"><div><b>${esc(batchLabel(c))}</b><small>${isPay(c) ? 'Payroll bulanan' : c.total_box + ' box'}</small></div><div class="r"><b>${rupiah(isPay(c) ? c.total_weekly : c.total_cost)}</b></div></div>`).join('') || '<div class="empty">Belum ada rekap pendapatan bulan ini.</div>'}</div>`;
  if (PF.tab === 'complaint') out.innerHTML = `<h2>Complaint</h2><div class="list">${comp.map(c => `<div class="li" style="display:block"><div class="row" style="justify-content:space-between"><b>${esc(c.tipe || 'Complaint')}</b><span class="small muted">${fmtDate(c.tanggal)}</span></div><small style="display:block;margin-top:2px">${esc(c.nama_customer || '')}${c.sesi ? ' · ' + esc(c.sesi) : ''}</small><div class="small" style="margin-top:4px">${esc(c.keterangan || '')}</div></div>`).join('') || '<div class="empty">Tidak ada complaint. Pertahankan!</div>'}</div>`;
  if (PF.tab === 'sesi') {
    const g = {}; sla.forEach(x => (g[x.tanggal + '|' + x.sesi] = g[x.tanggal + '|' + x.sesi] || []).push(x));
    out.innerHTML = `<h2>Riwayat sesi</h2><div class="list">${Object.entries(g).sort((a, b) => b[0].localeCompare(a[0])).map(([k, rows]) => { const [d, s] = k.split('|'), b = rows.reduce((a, x) => a + x.qty_box, 0), l = rows.reduce((a, x) => a + x.box_terlambat, 0), end = rows.map(x => x.max_time || '').sort().pop().slice(0, 5); return `<div class="li"><div><b>${fmtShort(d)} · ${esc(s)}</b><small>${rows.map(x => x.mode + ' ' + x.qty_box).join(' · ')}${end ? ' · selesai ' + end : ''}</small></div><div class="r"><b>${b} box</b>${l ? `<span class="chip c-warn">${l} telat</span>` : '<span class="chip c-ok">Tepat waktu</span>'}</div></div>`; }).join('') || '<div class="empty">Belum ada data sesi bulan ini.</div>'}</div>`;
  }
  out.querySelectorAll('[data-c]').forEach(x => x.onclick = () => { const c = costs.find(y => String(y.id) === x.dataset.c); openSheet(esc(batchLabel(c)), `<dl class="kv"><dt>Total box</dt><dd>${c.total_box} (HG ${c.box_hg} · BK ${c.box_bk})</dd><dt>${isPay(c) ? 'Payroll' : 'Gaji mingguan'}</dt><dd>${rupiah(c.total_weekly)}</dd><dt>Estafet</dt><dd>${rupiah(c.estafet)}</dd><dt>Jarak</dt><dd>${rupiah(c.jarak)}</dd><dt>Parkir</dt><dd>${rupiah(c.parkir)}</dd><dt>Gedung</dt><dd>${rupiah(c.gedung)}</dd><dt>Lain-lain</dt><dd>${rupiah(c.dll)}</dd><dt>Total</dt><dd style="font-size:17px">${rupiah(c.total_cost)}</dd></dl>`); });
}

/* ---------- Akun (ganti password, keluar) ---------- */
function akunSheet() {
  openSheet('Akun saya', `<dl class="kv" style="margin-bottom:14px"><dt>Nama</dt><dd>${esc(ME.nama)}</dd><dt>Username</dt><dd>${esc(ME.username)}</dd><dt>Area</dt><dd>${esc(areaNama() || 'Belum ada')}</dd></dl>
  <div class="form"><label class="f"><span>Password baru</span><input id="pw1" type="password" autocomplete="new-password"></label><label class="f"><span>Ulangi password baru</span><input id="pw2" type="password" autocomplete="new-password"></label>
  <button class="btn-primary btn-block" id="pwSave">Ganti password</button><button class="btn-block" id="outBtn2">Keluar</button></div>`);
  $('#pwSave').onclick = () => run($('#pwSave'), async () => { const a = $('#pw1').value, b = $('#pw2').value; if (a.length < 8) throw new Error('Password minimal 8 karakter.'); if (a !== b) throw new Error('Kedua password tidak sama.'); const { error } = await sb.auth.updateUser({ password: a }); if (error) throw new Error(error.message); closeSheet(); toast('Password berhasil diganti.'); });
  $('#outBtn2').onclick = () => HGAuth.logout();
}

/* ---------- Router ---------- */
const PAGES = { absen: pageAbsen, reimburse: pageReimburse, performa: pagePerforma };
async function render() {
  stopCam(); clearInterval(pageAbsen.t);
  let id = location.hash.slice(1); if (!PAGES[id]) id = 'absen';
  let dot = false; try { const { count } = await sb.from('dlv_complaints').select('id', { count: 'exact', head: true }).eq('profile_id', ME.id).gte('tanggal', addDays(TODAY, -7)); dot = count > 0; } catch (_) { }
  $('#bnav').innerHTML = TABS.map(([k, l]) => `<a href="#${k}" class="${k === id ? 'active' : ''}" ${k === id ? 'aria-current="page"' : ''}><span class="ico">${ICON[k]}${k === 'performa' && dot ? '<i class="dot" aria-label="Ada complaint baru"></i>' : ''}</span><span>${l}</span></a>`).join('') + `<a href="/delivery/training/">${ICON.training}<span>Training</span></a>`;
  document.title = TABS.find(t => t[0] === id)[1] + ' · Kurir Healthy Go';
  try { await PAGES[id]($('#view')); } catch (e) { $('#view').innerHTML = `<div class="card empty">Gagal memuat: ${esc(e.message)}</div>`; }
}
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
$('#outBtn').onclick = akunSheet;

(async () => {
  const me = await HGAuth.guard('dlv-kurir');
  ME = me.profile;
  try { await loadBase(); } catch (e) { $('#view').innerHTML = `<div class="card empty">Gagal memuat: ${esc(e.message)}</div>`; return; }
  $('#av').textContent = ME.nama.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
  $('#meName').textContent = ME.nama; $('#meSub').textContent = [areaNama(), branchNama()].filter(Boolean).join(' · ') || 'Belum ada area';
  render();
})();

</script>
