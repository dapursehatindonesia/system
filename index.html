<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04331f">
<title>Masuk · Healthy Go</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--hg:#074b34;--hg-deep:#04331f;--hg-700:#0b5e41;--hg-500:#1d8a5b;--hg-50:#f1f7f3;--sun:#f3cf1b;
--bg:#f4f6f1;--card:#fff;--ink:#13241c;--muted:#5d6e65;--line:#dde6df;--field:#fff;--bad:#b4281c;--bad-bg:#fde7e4;--info:#1f5f99;--info-bg:#e6f0fb;--ok:#167a43;--ok-bg:#e2f4e8;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a15;--card:#16241d;--ink:#e6efe9;--muted:#9db0a5;--line:#2a3c33;--field:#1b2c24;--hg-50:#18291f;--bad:#f2877b;--bad-bg:#3e1d19;--info:#8bbcf0;--info-bg:#18293d;--ok:#5fd08f;--ok-bg:#183a27;color-scheme:dark}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
button,input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.hero{background:var(--hg-deep);color:#fff;padding:36px 20px 96px;text-align:center}
.logo{width:56px;height:56px;border-radius:16px;background:var(--sun);color:var(--hg-deep);display:grid;place-items:center;font-weight:800;font-size:20px;margin:0 auto 14px}
.hero h1{margin:0;font-size:24px;letter-spacing:-.01em}.hero p{margin:6px 0 0;color:#a9c9b6}
.wrap{max-width:460px;margin:-70px auto 40px;padding:0 16px}
.wrap.wide{max-width:880px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 10px 30px rgba(4,51,31,.08)}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:14px}
input{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;color:var(--ink);font-weight:500;width:100%}
.pw{position:relative}.pw input{padding-right:70px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--hg-500);font-weight:700;font-size:13px;padding:8px;cursor:pointer}
.btn{width:100%;border:0;border-radius:14px;padding:14px;background:var(--hg);color:#fff;font-weight:700;font-size:16px;cursor:pointer}
.btn:hover{background:var(--hg-700)}.btn:disabled{opacity:.6;cursor:wait}
.btn-ghost{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer}
.msg{border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;margin-bottom:14px}
.msg.bad{background:var(--bad-bg);color:var(--bad)}.msg.info{background:var(--info-bg);color:var(--info)}.msg.ok{background:var(--ok-bg);color:var(--ok)}
.hint{color:var(--muted);font-size:13px;text-align:center;margin:14px 0 0}
.who{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.avatar{width:46px;height:46px;border-radius:14px;background:var(--sun);color:var(--hg-deep);display:grid;place-items:center;font-weight:800;flex:none}
.who b{display:block;font-size:17px}.who small{color:var(--muted)}
.who .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.grp{margin:22px 0 10px;font-size:13px;font-weight:700;color:var(--muted)}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.app{display:flex;flex-direction:column;gap:4px;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--field);text-decoration:none;color:var(--ink);transition:border-color .15s,transform .15s}
.app:hover{border-color:var(--hg-500);transform:translateY(-2px)}
.app b{font-size:16px}.app small{color:var(--muted)}
.tag{align-self:flex-start;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--hg-50);color:var(--hg-500);border:1px solid var(--line)}
.center{text-align:center;color:var(--muted);padding:30px 0}
.modal{position:fixed;inset:0;background:rgba(5,20,13,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.open{display:flex}.modal .card{width:min(420px,100%)}
.modal h2{margin:0 0 14px;font-size:18px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}.row .btn{width:auto;padding:10px 18px;font-size:15px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="hero"><div class="logo" aria-hidden="true">HG</div><h1 id="heroTitle">Healthy Go</h1><p id="heroSub">Masuk untuk melanjutkan</p></header>

<main class="wrap" id="wrap">
  <!-- Memuat -->
  <section class="card center" id="vLoading">Memeriksa sesi…</section>

  <!-- Login -->
  <section class="card" id="vLogin" hidden>
    <div id="loginMsg" role="alert"></div>
    <form id="loginForm" novalidate>
      <label>Username<input id="uName" autocomplete="username" autocapitalize="none" spellcheck="false" inputmode="text" placeholder="contoh: ade.ferdiansyah"></label>
      <label>Password<span class="pw"><input id="uPass" type="password" autocomplete="current-password"><button type="button" id="togglePw" aria-label="Tampilkan password">Lihat</button></span></label>
      <button class="btn" id="loginBtn" type="submit">Masuk</button>
    </form>
    <p class="hint">Lupa password? Hubungi admin divisi Anda untuk reset.</p>
  </section>

  <!-- Portal -->
  <section class="card" id="vPortal" hidden>
    <div class="who"><div class="avatar" id="pAv"></div><div><b id="pName"></b><small id="pRole"></small></div>
      <div class="acts"><button class="btn-ghost" id="pwBtn">Ganti password</button><button class="btn-ghost" id="outBtn">Keluar</button></div></div>
    <div id="portalMsg" style="margin-top:16px"></div>
    <div id="appList"></div>
  </section>
</main>

<div class="modal" id="pwModal" role="dialog" aria-modal="true" aria-labelledby="pwTitle"><div class="card">
  <h2 id="pwTitle">Ganti password</h2><div id="pwMsg"></div>
  <label>Password baru<input id="pw1" type="password" autocomplete="new-password" minlength="8"></label>
  <label>Ulangi password baru<input id="pw2" type="password" autocomplete="new-password"></label>
  <div class="row"><button class="btn-ghost" id="pwCancel">Batal</button><button class="btn" id="pwSave">Simpan</button></div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/shared/config.js"></script>
<script src="/shared/auth.js"></script>
<script>
const { sb, toEmail, safeNext, profile } = HGAuth;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const params = new URLSearchParams(location.search);
const NEXT = safeNext(params.get('next'));
const DENIED = params.get('denied');
const STAY = params.has('portal');   // /?portal=1 → tampilkan portal, jangan auto-redirect

function view(id) { ['vLoading', 'vLogin', 'vPortal'].forEach(v => $('#' + v).hidden = v !== id); $('#wrap').classList.toggle('wide', id === 'vPortal'); }
function msg(el, text, type = 'bad') { $(el).innerHTML = text ? `<div class="msg ${type}">${esc(text)}</div>` : ''; }
const go = url => location.replace(url);

function showLogin(text, type) {
  view('vLogin'); $('#heroTitle').textContent = 'Healthy Go'; $('#heroSub').textContent = 'Masuk untuk melanjutkan';
  msg('#loginMsg', text || (NEXT ? 'Silakan masuk untuk membuka halaman tersebut.' : ''), text ? (type || 'bad') : 'info');
  setTimeout(() => $('#uName').focus(), 50);
}

async function afterLogin(user) {
  view('vLoading');
  let prof;
  try { prof = await profile(user.id); } catch (e) { return showLogin('Gagal memuat profil: ' + e.message); }
  if (!prof) { await sb.auth.signOut(); return showLogin('Akun ini belum terdaftar sebagai SDM. Hubungi admin.'); }
  if (!prof.aktif) { await sb.auth.signOut(); return showLogin('Akun Anda nonaktif. Hubungi admin.'); }

  const { data: apps, error } = await sb.rpc('aplikasi_saya');
  if (error) return showLogin('Gagal memuat daftar aplikasi: ' + error.message);

  // 1. Kembali ke halaman yang tadi diminta, kalau boleh dibuka
  if (NEXT && apps.some(a => NEXT === a.url || NEXT.startsWith(a.url + '/') || NEXT.startsWith(a.url + '?') || NEXT.startsWith(a.url + '#'))) return go(NEXT);
  // 2. Langsung ke aplikasi utama (kurir → aplikasi kurir), kecuali sengaja membuka portal
  if (!DENIED && !STAY && apps.length) {
    if (apps.length === 1) return go(apps[0].url + '/');
    const utama = apps.find(a => a.utama);
    if (utama) return go(utama.url + '/');
  }
  showPortal(prof, apps);
}

function showPortal(prof, apps) {
  view('vPortal');
  $('#heroTitle').textContent = 'Halo, ' + prof.nama.split(' ')[0];
  $('#heroSub').textContent = 'Pilih aplikasi yang ingin dibuka';
  $('#pAv').textContent = prof.nama.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
  $('#pName').textContent = prof.nama;
  $('#pRole').textContent = (prof.positions ? prof.positions.nama : prof.position_id) + ' · ' + (prof.divisions ? prof.divisions.nama : 'Semua divisi');
  msg('#portalMsg', DENIED ? 'Anda tidak punya akses ke aplikasi tersebut.' : !apps.length ? 'Akun Anda belum punya akses ke aplikasi mana pun. Hubungi admin.' : '', DENIED ? 'bad' : 'info');
  const groups = {};
  apps.forEach(a => (groups[a.divisi || 'Lintas divisi'] = groups[a.divisi || 'Lintas divisi'] || []).push(a));
  $('#appList').innerHTML = Object.entries(groups).map(([g, list]) => `<div class="grp">${esc(g)}</div><div class="apps">${list.map(a => `<a class="app" href="${esc(a.url)}/"><b>${esc(a.nama)}</b><small>${esc(a.url)}</small>${a.utama ? '<span class="tag">Utama</span>' : ''}</a>`).join('')}</div>`).join('');
}

$('#togglePw').onclick = () => { const i = $('#uPass'), show = i.type === 'password'; i.type = show ? 'text' : 'password'; $('#togglePw').textContent = show ? 'Tutup' : 'Lihat'; };

$('#loginForm').onsubmit = async e => {
  e.preventDefault();
  const u = $('#uName').value.trim().toLowerCase(), p = $('#uPass').value;
  if (!/^[a-z0-9._-]{4,40}$/.test(u)) return msg('#loginMsg', 'Username 4–40 karakter: huruf kecil, angka, titik, garis bawah, atau strip.');
  if (!p) return msg('#loginMsg', 'Isi password.');
  const b = $('#loginBtn'); b.disabled = true; b.textContent = 'Memeriksa…'; msg('#loginMsg', '');
  const { data, error } = await sb.auth.signInWithPassword({ email: toEmail(u), password: p });
  b.disabled = false; b.textContent = 'Masuk';
  if (error) {
    const m = error.status === 429 ? 'Terlalu banyak percobaan. Tunggu beberapa menit lalu coba lagi.'
      : /invalid login credentials/i.test(error.message) ? 'Username atau password salah.'
      : /fetch|network/i.test(error.message) ? 'Tidak bisa terhubung. Periksa koneksi internet.'
      : 'Gagal masuk: ' + error.message;
    return msg('#loginMsg', m);
  }
  $('#uPass').value = '';
  afterLogin(data.user);
};

$('#outBtn').onclick = async () => { await sb.auth.signOut(); history.replaceState(null, '', '/'); showLogin('Anda sudah keluar.', 'ok'); };

// Ganti password
const pwModal = $('#pwModal');
$('#pwBtn').onclick = () => { msg('#pwMsg', ''); $('#pw1').value = $('#pw2').value = ''; pwModal.classList.add('open'); $('#pw1').focus(); };
$('#pwCancel').onclick = () => pwModal.classList.remove('open');
pwModal.onclick = e => { if (e.target === pwModal) pwModal.classList.remove('open'); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') pwModal.classList.remove('open'); });
$('#pwSave').onclick = async () => {
  const a = $('#pw1').value, c = $('#pw2').value;
  if (a.length < 8) return msg('#pwMsg', 'Password minimal 8 karakter.');
  if (a !== c) return msg('#pwMsg', 'Kedua password tidak sama.');
  $('#pwSave').disabled = true;
  const { error } = await sb.auth.updateUser({ password: a });
  $('#pwSave').disabled = false;
  if (error) return msg('#pwMsg', 'Gagal: ' + error.message);
  msg('#pwMsg', 'Password berhasil diganti.', 'ok'); setTimeout(() => pwModal.classList.remove('open'), 1200);
};

(async () => {
  const { data: { session } } = await sb.auth.getSession();
  session ? afterLogin(session.user) : showLogin();
})();
</script>
</body>
</html>
